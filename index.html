        /* ДИАГНОСТИКА: показываем, КТО реально вошёл и какой билд на хостинге —
           по этой строке сразу видно: старый файл (нет v19.3) или другой аккаунт (чужой UID/email) */
        bannerMsg($("loginErr"), t("loginNotAdmin") +

  /* 🔒 Телефон: при вводе остаются только цифры и один «+» в начале (макс. 20 символов) */
  function sanitizePhone(el) {
    let v = String(el.value).replace(/[^\d+]/g, "").slice(0, 20);
    v = (v.startsWith("+") ? "+" : "") + v.replace(/\+/g, "");
    if (el.value !== v) el.value = v;
  }
  $("fPhone").addEventListener("input", e => sanitizePhone(e.target));
  /* 🔒 Поле скрутки просмотров — только цифры (защита от мусора и минусов) */
  document.addEventListener("input", e => {

      const v = String(e.target.value).replace(/[^\d]/g, "").slice(0, 6);
      if (e.target.value !== v) e.target.value = v;

  });

    $("fTitle").placeholder = t(cat.base === "stores" || cat.base === "pharmacies" ? "fTitleStore"
                              : cat.base === "repair" ? "fTitleRepair"
                              : cat.base === "services" ? "fTitleVenue"
                              : "fTitlePerson");
    const isTransport = subcat === "transport";
    $("fCarField").hidden = !isTransport;
    $("fCarLabel").innerHTML = esc(t("carMake")) + (isTransport ? ' <span class="req">*</span>' : "");
    if (!isTransport) $("fCar").value = "";
    syncRoutesUI();
  }

  /* ============ Маршруты (перевозки): пункт А = город карточки (автоматически,
     выбирается выше в поле «Город»), пункт Б — тап по городам ниже ============ */
  function syncRoutesUI() {
    const subcat = $("fSub").value;
    const isTransport = subcat === "transport";
    $("fRoutesField").hidden = !isTransport;
    if (!isTransport) return;
    const city = $("fCity").value;
    if (formRoutes.includes(city)) formRoutes = formRoutes.filter(id => id !== city);
    $("fRoutesPick").innerHTML = CITIES.filter(c => c.id !== city).map(c =>
      `<button type="button" class="chip${formRoutes.includes(c.id) ? " on" : ""}" data-route="${c.id}">${esc(nm(c))}</button>`).join("");
  }
  $("fCat").addEventListener("change", syncLevelSelect);
  $("fLevel").addEventListener("change", fillSubSelect);
  $("fSub").addEventListener("change", updateLocLabel);
  $("fCity").addEventListener("change", syncRoutesUI);
  /* Пункт Б: тап по городу добавляет/убирает направление (повторный тап — снимает) */
  $("fRoutesPick").addEventListener("click", e => {
    const b = e.target.closest("[data-route]");
    if (!b) return;
    const id = b.dataset.route;
    if (formRoutes.includes(id)) {
      formRoutes = formRoutes.filter(x => x !== id);
      b.classList.remove("on");
    } else {
      formRoutes.push(id);
      b.classList.add("on");
    }
  });

  $("fDesc").addEventListener("input", () => {
    const n = $("fDesc").value.length;
    const c = $("descCounter");
    c.textContent = `${n} / 600`;
    c.classList.toggle("over", n > 600);
  });

  function openAddModal() {
    editingId = null;
    formRoutes = [];
    $("addModalTitle").textContent = t("addTitle");
    $("addForm").reset();
    $("addErr").classList.remove("show");
    $("descCounter").textContent = "0 / 600";
    $("descCounter").classList.remove("over");
    fillCatSelect();
    /* Подкатегория предвыбрана из текущего раздела: из «Перевозок меж городов»
       анкета перевозок создаётся сразу — с уже открытым выбором пунктов Б */
    if (state.sub !== "all" && Array.from($("fSub").options).some(o => o.value === state.sub)) {
      $("fSub").value = state.sub;
      updateLocLabel();
    }
    openOv("addOverlay");
  }

  function openEditModal(id) {
    const d = state.docs.find(x => x.id === id);
    if (!d) return;
    editingId = id;
    formRoutes = [];   /* сброс: старые маршруты не должны утечь в чужую анкету */
    $("addModalTitle").textContent = t("editTitle");
    $("addForm").reset();
    $("addErr").classList.remove("show");
    $("descCounter").textContent = "0 / 600";
    $("descCounter").classList.remove("over");
    fillCatSelect();
    $("fCity").value = docCityId(d);
    const cat = CATS.find(c => c.base === (d.category || d.group)) || catById(state.cat);
    $("fCat").value = cat.id;
    syncLevelSelect();
    if (cat.levels) $("fLevel").value = d.group || cat.levels[0].id;
    fillSubSelect();
    const subOpts = Array.from($("fSub").options).map(o => o.value);
    if (subOpts.includes(d.subcategory)) $("fSub").value = d.subcategory;
    updateLocLabel();
    if (d.subcategory === "transport" && Array.isArray(d.routes)) {
      formRoutes = d.routes.filter(id => CITIES.some(c => c.id === id));
      syncRoutesUI(); /* перерисовать пункты Б с уже выбранными */
    }
    $("fTitle").value = d.title || "";
    $("fTitleEn").value = (d.names && d.names.en) || "";
    $("fPhone").value = d.phone || "";
    $("fLoc").value = d.location || "";
    if (d.subcategory === "transport") $("fCar").value = d.carMake || "";
    $("fDesc").value = d.description || "";
    $("descCounter").textContent = `${$("fDesc").value.length} / 600`;
    openOv("addOverlay");
  }

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cat = catById($("fCat").value);
    const groupId = cat.levels ? $("fLevel").value : cat.id;
    const subcat = $("fSub").value;
    const title = $("fTitle").value.trim();      /* название на арабском (обязательно) */
    const titleEn = $("fTitleEn").value.trim();  /* название на английском (по желанию) */
    const phone = $("fPhone").value.trim();
    const location = $("fLoc").value.trim();
    const carMake = $("fCar").value.trim();
    const description = $("fDesc").value.trim();
    const ttlMs = Number($("fExp").value) || 2592000000;
    const city = $("fCity").value;

    if (!city) { banner($("addErr"), "fillRequired"); return; }
    if (!title || !phone || !groupId) { banner($("addErr"), "fillRequired"); return; }
    if (!/^\+?\d{7,15}$/.test(phone)) { banner($("addErr"), "phoneBad"); return; }
    if (needsLocation(cat, subcat) && !location) { banner($("addErr"), "locRequired"); return; }
    const routes = subcat === "transport" ? formRoutes.slice() : [];
    if (subcat === "transport" && !routes.length) { banner($("addErr"), "routeRequired"); return; }
    if (subcat === "transport" && !carMake) { banner($("addErr"), "carMakeRequired"); return; }
    if (description.length > 600) { banner($("addErr"), "descLimit"); return; }

    /* busy-состояние: кнопка сразу показывает «Сохранение…» — видно, что клик сработал,
       даже если Firestore отвечает долго (долгий поллинг/медленная сеть) */
    const saveBtn = $("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = t("saving");

    try {
      const payload = {
        type: cat.base === "stores" || cat.base === "pharmacies" ? "store"
             : cat.base === "services" || cat.base === "repair" ? "service" : "person",
        category: cat.base,
        group: groupId,
        subcategory: subcat,
        city,
        carMake: subcat === "transport" ? carMake : "",
        routes,
        title, phone, location, description
      };
      /* names — только ручные названия: арабский (обязателен) + английский (если заполнен).
         Автоперевода больше нет; при правке карта перезаписывается целиком —
         старые автоматические переводы (ru/ku) удаляются вместе с ней */
      payload.names = { ar: title };
      if (titleEn) payload.names.en = titleEn;
      if (editingId) {
        /* Правка: активную карточку не пересоздаём — срок хранения сохраняем,
           просроченную (или без даты) — продлеваем на выбранный период */
        const orig = state.docs.find(x => x.id === editingId);
        const expired = !orig || !orig.expiresAt || orig.expiresAt <= Date.now();
        payload.expiresAt = expired ? Date.now() + ttlMs : orig.expiresAt;
        await dbUpdate(editingId, payload);
        /* Мгновенно отражаем правку в списке: если менялся город — анкета
           переезжает в новый раздел сразу, не дожидаясь снапшота Firestore */
        const idx = state.docs.findIndex(x => x.id === editingId);
        if (idx !== -1) state.docs[idx] = { ...state.docs[idx], ...payload };
        renderAll();
        closeOv("addOverlay");
        toast(t("toastUpdated"));
      } else {
        payload.expiresAt = Date.now() + ttlMs;
        await dbAdd(payload);
        closeOv("addOverlay");
        toast(t("toastAdded"));
      }
      editingId = null;
      $("addModalTitle").textContent = t("addTitle");
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = t("save");
    }
  });

  /* ================= Удаление / редактирование ================= */
  $("list").addEventListener("click", e => {
    const del = e.target.closest(".row-del");
    if (del) {
      pendingDeleteId = del.dataset.id;
      const p = state.docs.find(d => d.id === pendingDeleteId);
      $("confirmText").textContent = t("confirmDesc").replace("{title}", p ? pname(p) : "");
      openOv("confirmOverlay");
      return;
    }
    const editBtn = e.target.closest(".row-edit");
    if (editBtn) openEditModal(editBtn.dataset.id);
  });

  $("confirmDeleteBtn").addEventListener("click", async () => {
    if (!pendingDeleteId) return;
    try {
      await dbRemove(pendingDeleteId);
      toast(t("toastDeleted"));
      if (state.detailId === pendingDeleteId) { closeOv("detailOverlay"); state.detailId = null; }
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    }
    pendingDeleteId = null;
    closeOv("confirmOverlay");
  });

  /* ================= Экспорт всех анкет в Excel (только админ, вкладка «Инструменты») ================= */
  $("toolExportIc").innerHTML = icon("download", 20);
  let exportBusy = false;

  /* Библиотека SheetJS грузится с CDN только при первом экспорте —
     обычные посетители её не качают */
  function loadXLSXLib() {
    return new Promise((res, rej) => {
      if (window.XLSX) return res();
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = res;
      s.onerror = () => rej(new Error("XLSX library failed to load"));
      document.head.appendChild(s);
    });
  }

  /* Дата из Firestore Timestamp (createdAt/updatedAt) или числа мс (expiresAt) */
  function fmtTs(v) {
    if (v === null || v === undefined || v === "") return "";
    try {
      const d = typeof v.toDate === "function" ? v.toDate() : new Date(Number(v));
      if (isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { return ""; }
  }

  /* Строки для Excel — все поля анкеты, значения по-человечески (не id) */
  function buildExportRows(docs) {
    return (docs || []).map(p => {
      const cat = CATS.find(c => c.id === p.category || c.base === p.category);
      const lv = cat && cat.levels ? cat.levels.find(l => l.id === p.group) : null;
      const routes = Array.isArray(p.routes) ? p.routes : [];
      return {
        "ID": p.id || "",
        "Название (ар)": (p.names && p.names.ar) || p.title || "",
        "Название (en)": (p.names && p.names.en) || "",
        "Категория": cat ? catName(cat) : (p.category || ""),
        "Уровень": lv ? levelName(lv) : "",
        "Подкатегория": p.subcategory ? subName(p.group || p.category, p.subcategory) : "",
        "Город": cityName(p.city),
        "Телефон": p.phone || "",
        "Локация": p.location || "",
        "Маршруты": routes.map(id => cityName(id)).join(", "),
        "Марка авто": p.carMake || "",
        "Просмотры": p.views || 0,
        "Описание": p.description || "",
        "Создано": fmtTs(p.createdAt),
        "Обновлено": fmtTs(p.updatedAt),
        "Действует до": fmtTs(p.expiresAt)
      };
    });
  }

  function exportExcel() {
    const rows = buildExportRows(state.docs);
    if (!rows.length) { toast(t("exportEmpty"), "err"); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    /* ширины колонок по самой длинной ячейке (потолок 40) */
    ws["!cols"] = Object.keys(rows[0]).map(k => ({
      wch: Math.min(40, Math.max(k.length + 2, ...rows.map(r => String(r[k] ?? "").length + 2)))
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Анкеты");
    const dte = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    XLSX.writeFile(wb, `dalil-ankety-${dte.getFullYear()}-${pad(dte.getMonth() + 1)}-${pad(dte.getDate())}.xlsx`);
    toast(t("exportDone").replace("{n}", rows.length));
  }

  $("toolExportBtn").addEventListener("click", async () => {
    if (exportBusy) return;
    exportBusy = true;
    toast(t("exportBusy"));
    try {
      await loadXLSXLib();
      exportExcel();
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    }
    exportBusy = false;
  });

  /* ================= v1.3.0 · Бэкап всех анкет в JSON =================
     Полная копия providers одним файлом — страховка перед массовыми
     изменениями и способ переноса на другой проект. */
  $("toolBackupIc").innerHTML = icon("db", 20);
  $("toolSweepIc").innerHTML = icon("trash", 20);
  $("toolLogoutIc").innerHTML = icon("logout", 20);

  $("toolBackupBtn").addEventListener("click", () => {
    try {
      const dte = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const fname = `dalil-backup-${dte.getFullYear()}-${pad(dte.getMonth() + 1)}-${pad(dte.getDate())}.json`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(
        [JSON.stringify({ app: "DALIL SURIYA", version: APP_VERSION, exportedAt: dte.toISOString(), count: state.docs.length, providers: state.docs }, null, 2)],
        { type: "application/json;charset=utf-8" }));
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      toast(t("toolBackupOk"));
    } catch (err) { console.error(err); }
  });

  /* Удалить просроченные: двухшаговое подтверждение прямо на кнопке */
  let sweepArmed = null;
  $("toolSweepBtn").addEventListener("click", async () => {
    const expired = state.docs.filter(isExpired);
    if (!expired.length) { toast(t("toolSweepNone")); return; }
    if (sweepArmed !== true) {
      sweepArmed = true;
      toast(t("toolSweepArm"), "err", 4000);
      setTimeout(() => { sweepArmed = null; }, 4000);
      return;
    }
    sweepArmed = null;
    let n = 0;
    for (const p of expired) {
      try { await dbRemove(p.id); n++; }
      catch (err) { console.error("Sweep:", err); }
    }
    toast(t("toolSweepDone").replace("{n}", String(n)));
  });

  $("toolLogoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      closeOv("admOverlay");
      toast(t("toastLoggedOut"));
    } catch (e) { console.error(e); }
  });

  /* ================= v1.2.3 · Очередь заявок (только админ) =================
     Публичная форма пишет в applications со статусом pending.
     «Одобрить» = анкета переносится в providers и появляется в справочнике,
     «Отклонить» = заявка помечается отклонённой. Пока не одобрено — посетители её не видят. */
  let reqsUnsub = null;
  let reqsCache = [];

  function updateReqsBadge() {
    /* v1.3.0: бейджи рисует единый updateAdmBadges (вкладки + кнопка панели) */
    updateAdmBadges();
  }

  function watchReqs() {
    if (reqsUnsub) return;
    try {
      reqsUnsub = onSnapshot(
        query(collection(db, "applications"), where("status", "==", "pending")),
        snap => {
          reqsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) =>
              ((b.createdAt && b.createdAt.toDate) ? b.createdAt.toDate().getTime() : 0) -
              ((a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().getTime() : 0));
          updateReqsBadge();
          if (state.admin && $("admOverlay").classList.contains("show") && admTab === "reqs") renderReqs();
        },
        err => { console.error("Reqs snapshot:", err); });
    } catch (e) { console.error(e); }
  }
  function unwatchReqs() {
    if (reqsUnsub) { try { reqsUnsub(); } catch {} reqsUnsub = null; }
    reqsCache = [];
    updateReqsBadge();
  }

  function renderReqs() {
    const list = $("admReqsList");
    $("admReqsCount").textContent = reqsCache.length
      ? `${reqsCache.length} · ${t("reqsPending")}`
      : t("reqsEmpty");
    if (!reqsCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = reqsCache.map((r, i) => {
      const tel = (r.phone || "").replace(/[^\d+]/g, "");
      const routes = (Array.isArray(r.routes) && r.routes.length)
        ? `${esc(t("routeFrom"))}: ${esc(cityName(r.city))} ${flowArrow()} ${r.routes.map(id => esc(cityName(id))).join(" · ")}`
        : "";
      return `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan">${esc(planName(r.plan))} · ${esc(r.planPrice || PLAN_PRICE[r.plan] || "")}</span>
          <span class="req-date">${esc(fmtTs(r.createdAt))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${tel ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(r.city))}</span>
          <span>${icon("book", 13)}${esc(subName(r.group, r.subcategory))}</span>
          ${r.location ? `<span>${icon("pin", 13)}${esc(r.location)}</span>` : ""}
          ${r.carMake ? `<span>${icon("car", 13)}${esc(r.carMake)}</span>` : ""}
        </div>
        ${routes ? `<div class="req-meta"><span>${icon("route", 13)}${routes}</span></div>` : ""}
        ${r.description ? `<p class="req-desc">${esc(r.description)}</p>` : ""}
        <div class="req-actions">
          <button type="button" class="btn btn-solid req-approve" data-id="${esc(r.id)}">${icon("check", 14)}${esc(t("reqsApprove"))}</button>
          <button type="button" class="btn btn-danger req-reject" data-id="${esc(r.id)}">${icon("x", 14)}${esc(t("reqsReject"))}</button>
          ${tel ? `<a class="btn btn-outline" href="tel:${esc(tel)}">${icon("phone", 14)}${esc(t("call"))}</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.3.0: очередь заявок открыается вкладкой «Заявки» в админ-панели */

  $("admReqsList").addEventListener("click", e => {
    const ap = e.target.closest(".req-approve");
    if (ap) { approveReq(ap.dataset.id, ap); return; }
    const rj = e.target.closest(".req-reject");
    if (rj) { rejectReq(rj.dataset.id, rj); return; }
  });

  /* v1.2.5: перемотка справочника к только что одобренной анкете —
     админ сразу ВИДИТ результат, а не ищет её по городам и категориям */
  function showApproved(r) {
    try {
      const cat = CATS.find(c => c.id === r.category || c.base === r.category);
      const cityOk = CITIES.some(c => c.id === r.city);
      const lvls = cat ? levelsOf(cat) : [];
      const grp = lvls.some(l => l.id === r.group) ? r.group : (lvls[0] && lvls[0].id);
      if (cityOk) { state.city = r.city; store.set("dalil_city", state.city); }
      if (cat) state.cat = cat.id;
      if (grp) state.level = grp;
      state.sub = "all";
      state.dest = "all";
      state.levelSelected = !(cat && cat.levels);
      closeOv("admOverlay");
      animCities = true; animCats = true;
      renderCities(); updateCityVisibility(); renderCats(); renderSubs(); renderList();
      setTimeout(() => { try { $("listWrap").scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }, 80);
    } catch (e) { console.error(e); }
  }

  async function approveReq(id, btn) {
    const r = reqsCache.find(x => x.id === id);
    if (!r || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = t("reqsBusy");
    try {
      /* Публикация: та же структура payload, что и в админ-форме;
         срок действия — по выбранному тарифу (1 / 3 / 12 мес) */
      const ttl = PLAN_TTL[r.plan] || PLAN_TTL.m1;
      const payload = {
        type: r.type || "person",
        category: r.category,
        group: r.group,
        subcategory: r.subcategory,
        city: r.city,
        carMake: r.carMake || "",
        routes: Array.isArray(r.routes) ? r.routes : [],
        title: r.title || "",
        phone: r.phone || "",
        location: r.location || "",
        description: r.description || "",
        names: (r.names && r.names.ar) ? r.names : { ar: r.title || "" },
        views: 0,
        expiresAt: Date.now() + ttl
      };
      await withTimeout(addDoc(collection(db, "providers"),
        { ...payload, createdAt: serverTimestamp() }), 20000);
      await withTimeout(updateDoc(doc(db, "applications", id),
        { status: "approved", reviewedAt: serverTimestamp() }), 20000);
      /* v1.2.5: сразу показываем результат — экран прыгает к новой анкете */
      showApproved(r);
      toast(t("reqsApproved"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
      btn.disabled = false;
      btn.textContent = t("reqsApprove");
    }
  }

  async function rejectReq(id, btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = t("reqsBusy");
    try {
      await withTimeout(updateDoc(doc(db, "applications", id),
        { status: "rejected", reviewedAt: serverTimestamp() }), 20000);
      toast(t("reqsRejected"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
      btn.disabled = false;
      btn.textContent = t("reqsReject");
    }
  }

  /* ================= v1.2.7 · Напоминания об истечении (только админ) =================
     За 3 дня до конца срока (expiresAt) анкета попадает в панель «Напоминания».
     Панель сама открывается раз в сессию при входе админа; каждая карточка —
     кнопка «Напомнить»: WhatsApp владельца открывается с ГОТОВЫМ сообщением
     (имя, город, дата истечения, тариф, цена) на языке анкеты (uiLang, иначе арабский).
     «Напомнить»/«Пропустить» запоминаются в localStorage до конца дня —
     при продлении expiresAt меняется, и напоминание появится снова в новое окно. */
  const REM_WINDOW = 3 * 86400000;   /* напоминать за 3 дня до истечения TTL */
  const REM_MAP_KEY = "dalil_rem";
  const REM_SEEN_KEY = "dalil_rem_seen";
  const pad2 = (n) => String(n).padStart(2, "0");
  const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const loadRemMap = () => { try { return JSON.parse(store.get(REM_MAP_KEY) || "{}") || {}; } catch { return {}; } };
  let remCache = [];

  function updateReminders() {
    const now = Date.now();
    const map = loadRemMap();
    remCache = state.docs
      .filter(p => p.expiresAt && p.expiresAt > now && p.expiresAt - now <= REM_WINDOW)
      .filter(p => !(map[p.id] && map[p.id].e === p.expiresAt && map[p.id].d === dayKey(now)))
      .sort((a, b) => a.expiresAt - b.expiresAt);   /* срочные сверху */
    updateRemBadge();
    maybeAutoOpenRems();
  }

  function updateRemBadge() {
    /* v1.3.0: бейджи рисует единый updateAdmBadges (вкладки + кнопка панели) */
    updateAdmBadges();
  }

  /* Панель сама открывается на вкладке «Напоминания» раз за сессию,
     если есть кому напомнить */
  function maybeAutoOpenRems() {
    if (!state.admin || !remCache.length) return;
    try { if (sessionStorage.getItem(REM_SEEN_KEY)) return; sessionStorage.setItem(REM_SEEN_KEY, "1"); } catch {}
    openAdmPanel("rems");
  }

  function markReminded(id) {
    const map = loadRemMap();
    const r = remCache.find(x => x.id === id);
    if (r) map[id] = { e: r.expiresAt, d: dayKey(Date.now()) };
    store.set(REM_MAP_KEY, JSON.stringify(map));
  }

  function renderRems() {
    const list = $("admRemList");
    $("admRemCount").textContent = remCache.length
      ? `${remCache.length} · ${t("remPending")}`
      : t("remEmpty");
    if (!remCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = remCache.map((r, i) => {
      const tel = (r.phone || "").replace(/\D/g, "");
      const days = Math.max(1, Math.ceil((r.expiresAt - Date.now()) / 86400000));
      /* Сообщение владельцу — на языке его анкеты (uiLang), по умолчанию арабский */
      const ml = (r.uiLang && I18N[r.uiLang]) ? r.uiLang : "ar";
      const planTxt = t(r.plan === "m1" ? "subM1" : r.plan === "m3" ? "subM3" : "subY1", ml);
      const price = r.planPrice || PLAN_PRICE[r.plan] || "";
      const cObj = cityById(r.city);
      const cityTxt = cObj ? (cObj[ml] || cObj.ar || cObj.ku || cObj.ru) : (r.city || "");
      const d = new Date(r.expiresAt);
      const dateStr = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
      const msg = encodeURIComponent(
        t("remWaMsg", ml)
          .replace("{name}", r.title || "")
          .replace("{city}", cityTxt)
          .replace("{date}", dateStr)
          .replace("{n}", String(days))
          .replace("{plan}", planTxt)
          .replace("{price}", price));
      return `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan">${esc(planName(r.plan))} · ${esc(price)}</span>
          <span class="rem-warn">${icon("bell", 12)}${esc(t("remDays").replace("{n}", String(days)))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${r.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(r.city))}</span>
          <span>${icon("book", 13)}${esc(subName(r.group, r.subcategory))}</span>
        </div>
        <div class="req-actions">
          ${tel
            ? `<a class="btn btn-solid" href="https://wa.me/${esc(tel)}?text=${msg}" target="_blank" rel="noopener" data-remind="${esc(r.id)}">${icon("send", 14)}${esc(t("remRemind"))}</a>
             <button type="button" class="btn btn-outline" data-remskip="${esc(r.id)}">${icon("x", 14)}${esc(t("remSkip"))}</button>`
            : `<span class="req-desc">${esc(t("remNoPhone"))}</span>`}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.3.0: напоминания открыаются вкладкой «Напоминания» в админ-панели */

  $("admRemList").addEventListener("click", e => {
    const sk = e.target.closest("[data-remskip]");
    if (sk) {
      markReminded(sk.dataset.remskip);
      remCache = remCache.filter(x => x.id !== sk.dataset.remskip);
      updateRemBadge();
      renderRems();
      toast(t("remSkippedToast"));
      return;
    }
    const rd = e.target.closest("[data-remind]");
    if (rd) {
      markReminded(rd.dataset.remind);
      remCache = remCache.filter(x => x.id !== rd.dataset.remind);
      updateRemBadge();
      renderRems();   /* карточка уходит из списка — считаем напоминание отправленным */
      toast(t("remOpenedToast"));
    }
  });

  /* ================= v1.3.0 · ЯДРО АДМИН-ПАНЕЛИ =================
     Одна организованная панель вместо разрозненных кнопок:
     • 4 живые статкарточки (пересчёт на каждом снапшоте);
     • 5 вкладок: Заявки · Напоминания · Жалобы · Анкеты · Инструменты;
     • реестр анкет с поиском и продлением TTL в один клик;
     • жалобы посетителей из коллекции reports. */

  let admTab = "reqs";          /* активная вкладка панели */
  let admSearchQ = "";          /* поисковый запрос в реестре анкет */
  let repsUnsub = null;
  let repsCache = [];

  /* ---------- Бейджи: вкладки + плавающая кнопка ---------- */
  function setBadge(el, n) {
    if (!el) return;
    el.hidden = !n;
    if (n) el.textContent = n > 99 ? "99+" : String(n);
  }
  function updateAdmBadges() {
    if (!state.admin) return;
    setBadge($("admReqBadge"), reqsCache.length);
    setBadge($("admRemBadge"), remCache.length);
    setBadge($("admRepBadge"), repsCache.length);
    setBadge($("floatPanelBadge"), reqsCache.length + remCache.length + repsCache.length);
    if ($("admOverlay").classList.contains("show")) renderAdmStats();
  }

  /* ---------- Жалобы (reports) ---------- */
  function watchReports() {
    if (repsUnsub) return;
    try {
      repsUnsub = onSnapshot(
        query(collection(db, "reports"), where("status", "==", "new")),
        snap => {
          repsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) =>
              ((b.createdAt && b.createdAt.toDate) ? b.createdAt.toDate().getTime() : 0) -
              ((a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().getTime() : 0));
          updateAdmBadges();
          if ($("admOverlay").classList.contains("show") && admTab === "reps") renderReports();
        },
        err => { console.error("Reports snapshot:", err); });
    } catch (e) { console.error(e); }
  }
  function unwatchReports() {
    if (repsUnsub) { try { repsUnsub(); } catch {} repsUnsub = null; }
    repsCache = [];
    updateAdmBadges();
  }

  const REP_REASON_KEYS = { dead: "repR1", fake: "repR2", wrong: "repR3", other: "repR4" };

  function renderReports() {
    const list = $("admRepList");
    $("admRepCount").textContent = repsCache.length
      ? `${repsCache.length} · ${t("statReps")}`
      : t("repEmpty");
    if (!repsCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = repsCache.map((r, i) => `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan" style="color:#E07A6C;background:rgba(224,122,108,.12);border-color:rgba(224,122,108,.45)">${icon("flag", 12)}${esc(t(REP_REASON_KEYS[r.reason] || "repR4"))}</span>
          <span class="req-date">${esc(fmtTs(r.createdAt))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${r.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          ${r.city ? `<span>${icon("city", 13)}${esc(cityName(r.city))}</span>` : ""}
        </div>
        ${r.comment ? `<p class="req-desc">${esc(r.comment)}</p>` : ""}
        <div class="req-actions">
          <button type="button" class="btn btn-outline rep-open" data-id="${esc(r.id)}">${icon("book", 14)}${esc(t("repOpen"))}</button>
          <button type="button" class="btn btn-solid rep-resolve" data-id="${esc(r.id)}">${icon("check", 14)}${esc(t("repResolve"))}</button>
          <button type="button" class="btn btn-danger rep-del" data-id="${esc(r.id)}">${icon("trash", 14)}${esc(t("repDelete"))}</button>
        </div>
      </div>`).join("");
  }

  $("admRepList").addEventListener("click", async e => {
    const open = e.target.closest(".rep-open");
    if (open) {
      const r = repsCache.find(x => x.id === open.dataset.id);
      const p = r && state.docs.find(d => d.id === r.providerId);
      if (p) { showApproved(p); }
      else toast(t("repNoCard"), "err", 5000);
      return;
    }
    const res = e.target.closest(".rep-resolve");
    if (res) {
      try {
        await updateDoc(doc(db, "reports", res.dataset.id), { status: "resolved", resolvedAt: serverTimestamp() });
        repsCache = repsCache.filter(x => x.id !== res.dataset.id);
        updateAdmBadges(); renderReports();
      } catch (err) { toast(writeErrText(err), "err", 7000); }
      return;
    }
    const del = e.target.closest(".rep-del");
    if (del) {
      try {
        await dbRemove(del.dataset.id);
        repsCache = repsCache.filter(x => x.id !== del.dataset.id);
        updateAdmBadges(); renderReports();
      } catch (err) { toast(writeErrText(err), "err", 7000); }
    }
  });

  /* ---------- Статкарточки ---------- */
  function renderAdmStats() {
    const now = Date.now();
    $("statDocs").textContent = String(state.docs.filter(d => !isExpired(d)).length);
    $("statReqs").textContent = String(reqsCache.length);
    $("statExp").textContent = String(state.docs.filter(p => p.expiresAt && p.expiresAt > now && p.expiresAt - now <= REM_WINDOW).length);
    $("statReps").textContent = String(repsCache.length);
  }

  /* ---------- Реестр анкет (вкладка «Анкеты») ---------- */
  function ttlPill(p) {
    if (!p.expiresAt) return `<span class="ttl-pill ttl-warn">${esc(t("pillOld"))}</span>`;
    const ms = Number(p.expiresAt) - Date.now();
    if (ms <= 0) return `<span class="ttl-pill ttl-dead">${esc(t("pillExpired"))}</span>`;
    const days = Math.ceil(ms / 86400000);
    const d = new Date(Number(p.expiresAt));
    const dateStr = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
    if (days <= 7) return `<span class="ttl-pill ttl-warn">${esc(t("pillDays").replace("{n}", String(days)))}</span>`;
    return `<span class="ttl-pill ttl-ok">${esc(t("pillOk").replace("{d}", dateStr))}</span>`;
  }

  function renderAdmDocs() {
    const q = admSearchQ.toLowerCase();
    const qs = q.replace(/\s/g, "");
    const items = state.docs
      .filter(d => !q ||
        (d.title || "").toLowerCase().includes(q) ||
        (d.phone || "").replace(/\s/g, "").includes(qs) ||
        (d.names && Object.values(d.names).some(v => String(v || "").toLowerCase().includes(q))) ||
        cityName(docCityId(d)).toLowerCase().includes(q))
      .sort((a, b) => {
        const ea = a.expiresAt ? Number(a.expiresAt) : Infinity;
        const eb = b.expiresAt ? Number(b.expiresAt) : Infinity;
        if ((ea <= Date.now()) !== (eb <= Date.now())) return (ea <= Date.now()) ? -1 : 1;
        return ea - eb;   /* срочные и просроченные сверху */
      });
    $("admDocsCount").textContent = `${t("found")}: ${items.length}`;
    const list = $("admDocsList");
    if (!items.length) { list.innerHTML = ""; return; }
    list.innerHTML = items.map((p, i) => {
      const tel = (p.phone || "").replace(/[^\d+]/g, "");
      return `
      <div class="adm-doc" style="animation-delay:${Math.min(i * 35, 250)}ms">
        <div class="adm-doc-top">
          <span class="adm-doc-name">${esc(pname(p))}</span>
          ${ttlPill(p)}
        </div>
        <div class="req-meta">
          ${p.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(p.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(docCityId(p)))}</span>
          <span>${icon("book", 13)}${esc(subName(p.group, p.subcategory))}</span>
          <span>${icon("eye", 13)}${fmtViews(p.views)}</span>
        </div>
        <div class="adm-doc-actions">
          ${p.expiresAt ? `
          <button type="button" class="btn btn-outline btn-renew" data-renew="m1" data-id="${esc(p.id)}">${icon("bell", 13)}${esc(t("renM1"))}</button>
          <button type="button" class="btn btn-outline btn-renew" data-renew="m3" data-id="${esc(p.id)}">${icon("bell", 13)}${esc(t("renM3"))}</button>
          <button type="button" class="btn btn-outline btn-renew" data-renew="y1" data-id="${esc(p.id)}">${icon("bell", 13)}${esc(t("renY1"))}</button>`
          : ""}
          <button type="button" class="btn btn-outline adm-edit" data-id="${esc(p.id)}">${icon("edit", 13)}${esc(t("edit"))}</button>
          <button type="button" class="btn btn-danger adm-del" data-id="${esc(p.id)}">${icon("trash", 13)}${esc(t("delete"))}</button>
          ${tel ? `<a class="btn btn-outline" href="tel:${esc(tel)}">${icon("phone", 13)}${esc(t("call"))}</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  /* Продление TTL в один клик: срок отсчитывается от max(сейчас, текущий срок),
     чтобы активную анкету не укорачивать, а просроченную — не обидеть прошлым */
  async function renewProvider(id, plan, btn) {
    const p = state.docs.find(d => d.id === id);
    if (!p) return;
    if (btn) btn.disabled = true;
    try {
      const base = Math.max(Date.now(), Number(p.expiresAt) || 0);
      await dbUpdate(id, { expiresAt: base + (PLAN_TTL[plan] || PLAN_TTL.m1) });
      toast(t("toastRenewed"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    }
    if (btn) btn.disabled = false;
  }

  $("admDocsList").addEventListener("click", e => {
    const rn = e.target.closest("[data-renew]");
    if (rn) { renewProvider(rn.dataset.id, rn.dataset.renew, rn); return; }
    const ed = e.target.closest(".adm-edit");
    if (ed) { closeOv("admOverlay"); openEditModal(ed.dataset.id); return; }
    const del = e.target.closest(".adm-del");
    if (del) {
      pendingDeleteId = del.dataset.id;
      const p = state.docs.find(d => d.id === pendingDeleteId);
      $("confirmText").textContent = t("confirmDesc").replace("{title}", p ? pname(p) : "");
      openOv("confirmOverlay");
    }
  });

  $("admSearch").addEventListener("input", e => {
    admSearchQ = e.target.value.trim();
    renderAdmDocs();
  });

  /* ---------- Вкладки и открытие панели ---------- */
  function renderAdmTabs() {
    document.querySelectorAll("#admTabs .adm-tab").forEach(b =>
      b.classList.toggle("on", b.dataset.tab === admTab));
  }

  function renderAdmPane() {
    $("admViewReqs").hidden = admTab !== "reqs";
    $("admViewRems").hidden = admTab !== "rems";
    $("admViewReps").hidden = admTab !== "reps";
    $("admViewDocs").hidden = admTab !== "docs";
    $("admViewTools").hidden = admTab !== "tools";
    if (admTab === "reqs") renderReqs();
    if (admTab === "rems") renderRems();
    if (admTab === "reps") renderReports();
    if (admTab === "docs") renderAdmDocs();
  }

  /* При открытии — сразу вкладка с «работой»: жалобы → заявки → напоминания */
  function openAdmPanel(tab) {
    admTab = tab || (repsCache.length ? "reps" : reqsCache.length ? "reqs" : remCache.length ? "rems" : "docs");
    renderAdmStats();
    renderAdmTabs();
    renderAdmPane();
    openOv("admOverlay");
  }

  $("floatPanel").addEventListener("click", () => openAdmPanel());

  $("admTabs").addEventListener("click", e => {
    const b = e.target.closest(".adm-tab");
    if (!b || b.dataset.tab === admTab) return;
    admTab = b.dataset.tab;
    renderAdmTabs();
    renderAdmPane();
  });

  /* ================= Навигация ================= */
  $("cityGrid").addEventListener("click", e => {
    const b = e.target.closest(".city-card");
    if (!b || state.city === b.dataset.city) return;
    state.city = b.dataset.city;
    store.set("dalil_city", state.city);
    state.dest = "all";
    animCities = false;
    renderCities();
    updateCityVisibility();
    renderAll();
    setTimeout(() => { try { $("cats").scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }, 80);
  });

  $("cats").addEventListener("click", e => {
    const b = e.target.closest(".cat-pill");
    if (!b) return;
    state.cat = b.dataset.cat;
    const cat = catById(state.cat);
    state.level = levelsOf(cat)[0].id;
    state.sub = "all";
    state.dest = "all";
    state.levelSelected = !cat.levels;
    renderCats(); renderSubs(); renderList();
  });

  $("subs").addEventListener("click", e => {
    state.dest = "all";
    const subcard = e.target.closest("[data-subcard]");
    if (subcard) { state.sub = subcard.dataset.subcard; renderSubs(); renderList(); return; }
    const lvl = e.target.closest("[data-level]");
    if (lvl) {
      state.level = lvl.dataset.level;
      state.sub = "all";
      state.levelSelected = true;
      renderSubs(); renderList();
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) { state.sub = chip.dataset.sub; renderSubs(); renderList(); return; }
    if (e.target.closest("#addCardBtn")) openAddModal();
  });

  $("destFilter").addEventListener("click", e => {
    const chip = e.target.closest("[data-dest]");
    if (!chip) return;
    state.dest = chip.dataset.dest;
    renderDestFilter();
    renderList();
  });

  /* v1.3.0: чип «Избранное» + сортировка в списке */
  $("listTools").addEventListener("click", e => {
    const favChip = e.target.closest("[data-favtoggle]");
    if (favChip) {
      state.favOnly = !state.favOnly;
      renderListTools();
      renderList();
      return;
    }
    const sortChip = e.target.closest("[data-sort]");
    if (sortChip) {
      state.sort = sortChip.dataset.sort;
      store.set("dalil_sort", state.sort);
      renderListTools();
      renderList();
    }
  });

  $("searchInput").addEventListener("input", e => {
    state.search = e.target.value.trim();
    $("searchBox").classList.toggle("live", !!state.search);
    renderList();
  });

  function setLang(l) {
    if (state.lang === l) return;
    state.lang = l;
    store.set("dalil_lang", l);
    applyLang();
  }

  /* ============ Скролл-анимации и параллакс ============ */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("vis"); });
  }, { threshold: .12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  const moonEl = $("moon");
  window.addEventListener("scroll", () => {
    moonEl.style.transform = `translateY(${window.scrollY * -0.18}px)`;
  }, { passive: true });

  /* ================= Инициализация ================= */
  (async function init() {
    try {
      $("adminBtn").querySelector(".ic").innerHTML = icon("lock", 15);
      $("gearIc").innerHTML = icon("gear", 18);
      $("setThemeIc").innerHTML = icon("sun", 13);
      $("segLightIc").innerHTML = icon("sun", 15);
      $("segDarkIc").innerHTML = icon("moonIc", 15);
      $("setLangIc").innerHTML = icon("globe", 13);
      $("searchIcon").innerHTML = icon("search", 18);
      $("panelIc").innerHTML = icon("gear", 16);
      $("citiesIcon").innerHTML = icon("city", 22);
      $("admGearIc").innerHTML = icon("gear", 20);
      $("admSearchIc").innerHTML = icon("search", 17);
      $("agentIc2").innerHTML = icon("user", 20);
      $("appAgreeBox").innerHTML = icon("check", 14);
      $("appDoneIc").innerHTML = icon("check", 30);
      $("appDoneWaIc").innerHTML = icon("chat", 15);
      document.querySelectorAll(".modal-close").forEach(b => b.innerHTML = icon("x", 18));

      state.levelSelected = !catById(state.cat).levels;
      applyLang();
      renderAll();
      updateCityVisibility();
      startListener();
    } catch (e) {
      console.error(e);
      toast("⚠ " + (e.message || "خطأ في التهيئة"), "err");
    }
  })();
</script>
</body>
</html>
