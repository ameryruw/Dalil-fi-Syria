<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>دليل سوريا · DALIL SURIYA — Справочник Сирии</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 1.5 21.5 7v10L12 22.5 2.5 17V7z' fill='none' stroke='%23AF7F42' stroke-width='2'/><path d='M12 7l4.5 2.6v5.2L12 17.5l-4.5-2.7V9.6z' fill='%23AF7F42'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #18202f;
    --muted: #68748A;
    --card: #DCE1E6;
    --accent: #AF7F42;
    --accent2: #B8734F;
    --accent-hi: #C2924F;
    --accent-lo: #7D5F33;
    --line: rgba(104,116,138,.35);
    --line-soft: rgba(104,116,138,.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; overflow-x:hidden; }
  button:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  ::selection{ background:rgba(175,127,66,.5); color:#fff; }
  ::-webkit-scrollbar{ width:10px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(104,116,138,.35); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(175,127,66,.5); }
  html[dir="rtl"] body{ font-family:'Noto Kufi Arabic','Golos Text',sans-serif; }
  html[dir="rtl"] *{ letter-spacing:normal !important; }
  body{
    background: var(--bg);
    color: var(--card);
    font-family: 'Golos Text','Noto Sans','Noto Kufi Arabic',sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
  }
  button{ font: inherit; touch-action: manipulation; }
  svg{ flex-shrink:0; }
  h1, h2, h3, p, span, button, .tag, .chip{ overflow-wrap: break-word; }
  /* Атрибут hidden сильнее любых display из классов — иначе display:flex у .dest-filter перебивает hidden, и фильтр виден во всех разделах */
  [hidden]{ display:none !important; }
  .hero, .cats, .subs, .list-wrap, footer{ position:relative; }

  /* Телефон и числа в RTL: всегда слева направо */
  html[dir="rtl"] .ltr-num{ direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:7px; }
  html[dir="rtl"] .ltr-num > span{ direction:ltr; unicode-bidi:isolate; }

  /* ============ Фон: месяц (маска), орбиты, искры, мерцание, падающие звёзды ============ */
  .bg-deco{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .moon-wrap{
    position:absolute; top:78px; inset-inline-end:5%;
    width:170px; height:170px;
    will-change:transform;
  }
  .moon{
    position:relative; width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle at 38% 34%, #F6E3B8, var(--accent) 72%);
    /* настоящий месяц: вырез через маску — прозрачный серп, без чёрного круга */
    -webkit-mask: radial-gradient(circle at 66% 28%, transparent 0 46%, #000 47%);
    mask: radial-gradient(circle at 66% 28%, transparent 0 46%, #000 47%);
    /* усиленное свечение по форме месяца */
    filter: drop-shadow(0 0 20px rgba(175,127,66,.6)) drop-shadow(0 0 70px rgba(175,127,66,.35));
    animation: floaty 9s ease-in-out infinite;
    will-change: transform;
  }
  .ring{
    position:absolute; border-radius:50%;
    border:1px dashed rgba(175,127,66,.16);
    animation: spin 70s linear infinite;
  }
  .r1{ bottom:-220px; inset-inline-start:-170px; width:520px; height:520px; }
  .r2{ bottom:-120px; inset-inline-start:-70px; width:300px; height:300px;
       border-color: rgba(104,116,138,.14); animation-duration:52s; animation-direction:reverse; }
  .r3{ top:-130px; inset-inline-end:-90px; width:280px; height:280px;
       border-color: rgba(175,127,66,.12); animation-duration:64s; animation-direction:reverse; }
  .spark{
    position:absolute; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px rgba(175,127,66,.55);
    animation: drift 16s linear infinite;
  }
  .s1{ width:5px; height:5px; top:24%; inset-inline-start:10%; }
  .s2{ width:3px; height:3px; top:46%; inset-inline-start:22%; animation-duration:21s; animation-delay:-6s; }
  .s3{ width:4px; height:4px; top:64%; inset-inline-start:8%;  animation-duration:13s; animation-delay:-3s; }
  .s4{ width:3px; height:3px; top:14%; inset-inline-start:42%; animation-duration:18s; animation-delay:-9s; }
  .s5{ width:5px; height:5px; top:78%; inset-inline-start:36%; animation-duration:15s; animation-delay:-5s; }
  .s6{ width:3px; height:3px; top:34%; inset-inline-start:64%; animation-duration:19s; animation-delay:-12s; opacity:.4; }
  /* мерцающие звёзды */
  .tw{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#E8CB9C;
    box-shadow: 0 0 8px 2px rgba(232,203,156,.5);
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .tw1{ top:12%; inset-inline-start:28%; }
  .tw2{ top:32%; inset-inline-start:56%; animation-delay:-1.1s; }
  .tw3{ top:70%; inset-inline-start:16%; animation-delay:-2.2s; width:5px; height:5px; }
  /* падающие звёзды с хвостом */
  .shoot{
    position:absolute; top:18%; left:68%;
    width:110px; height:2px; border-radius:2px;
    background: linear-gradient(90deg, transparent, rgba(240,213,168,.95));
    transform: rotate(-35deg);
    opacity:0;
    animation: shoot 11s ease-in infinite;
  }
  .shoot2{
    top:8%; left:84%; width:80px;
    transform: rotate(-28deg);
    animation: shoot 13s ease-in infinite;
    animation-delay: 5.5s;
  }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-16px); } }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:.65; } 85%{ opacity:.3; }
    100%{ transform:translate(46px,-130px); opacity:0; }
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.7); }
    50%{ opacity:.9; transform:scale(1.15); }
  }
  @keyframes shoot{
    0%{ transform:translate(0,0) rotate(-35deg); opacity:0; }
    3%{ opacity:1; }
    12%{ transform:translate(-380px,250px) rotate(-35deg); opacity:0; }
    100%{ transform:translate(-380px,250px) rotate(-35deg); opacity:0; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ 3D-куб ============ */
  .cube-stage{
    width:54px; height:54px;
    perspective: 340px;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cube{
    position:relative; width:54px; height:54px;
    transform-style: preserve-3d;
    animation: cubeSpin 14s linear infinite;
  }
  @keyframes cubeSpin{
    from{ transform: rotateX(-18deg) rotateY(0deg); }
    to  { transform: rotateX(-18deg) rotateY(360deg); }
  }
  .cube .face{
    position:absolute; inset:0;
    border:1.5px solid var(--accent);
    border-radius:9px;
    background: rgba(175,127,66,.13);
    box-shadow: inset 0 0 18px rgba(175,127,66,.28);
  }
  .cube .f1{ transform: translateZ(27px); }
  .cube .f2{ transform: rotateY(180deg) translateZ(27px); }
  .cube .f3{ transform: rotateY(90deg)  translateZ(27px); }
  .cube .f4{ transform: rotateY(-90deg) translateZ(27px); }
  .cube .f5{ transform: rotateX(90deg)  translateZ(27px); }
  .cube .f6{ transform: rotateX(-90deg) translateZ(27px); }

  /* ============ Шапка ============ */
  .topbar{
    position: sticky; top:0; z-index:50;
    background: rgba(24,32,47,.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    height:64px; padding:0 24px;
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    font-weight:800; font-size:1.05rem; letter-spacing:.12em; color:var(--card);
    text-decoration:none; white-space:nowrap;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
    min-width:0;
  }
  .brand svg{ color: var(--accent); filter: drop-shadow(0 2px 6px rgba(175,127,66,.5)); }
  .brand-sub{
    font-family:'Noto Kufi Arabic',sans-serif;
    font-weight:400; font-size:.8rem; color:var(--muted);
    letter-spacing:0; align-self:flex-end; padding-bottom:2px;
  }
  html[dir="rtl"] .brand{ font-family:'Golos Text',sans-serif; }
  .lang-switch{
    margin-inline-start:auto;
    display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;
    flex-shrink:0;
  }
  .lang-switch button{
    background:none; border:none; cursor:pointer;
    color:var(--muted); font-weight:700; font-size:.78rem;
    padding:8px 13px; transition: background .2s, color .2s;
    min-width:40px; text-align:center;
  }
  .lang-switch button.on{ background: var(--accent); color: var(--bg); }
  .btn-sub{
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none;
    border-radius:9px; padding:8px 14px; font-size:.8rem; font-weight:800;
    cursor:pointer; white-space:nowrap; touch-action: manipulation; flex-shrink:0;
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.5);
    transition: filter .2s, transform .15s;
  }
  .btn-sub:hover{ filter: brightness(1.08); }
  .btn-sub:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-admin{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--accent); color:var(--accent);
    border-radius:9px; padding:8px 15px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition: background .2s, transform .15s;
    white-space:nowrap; touch-action: manipulation; flex-shrink:0;
  }
  .btn-admin:hover{ background: rgba(175,127,66,.16); }
  .btn-admin:active{ transform: scale(.96); }

  /* ============ Hero ============ */
  .hero{ max-width: 980px; margin:0 auto; padding: 62px 24px 26px; }
  .hero-meta{
    color:var(--muted); font-size:.72rem; font-weight:600;
    letter-spacing:.28em; text-transform:uppercase;
    display:flex; align-items:center; gap:14px;
  }
  html[dir="rtl"] .hero-meta{ letter-spacing:0; }
  .hero-meta::after{ content:""; flex:1; height:1px; background:var(--line); }
  .hero h1{
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    font-weight:800; line-height:1.15; margin:14px 0 4px;
    text-shadow: 0 4px 22px rgba(0,0,0,.45);
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .hero h1 em{ font-style:normal; color:var(--accent); text-shadow: 0 0 26px rgba(175,127,66,.4); }
  .hero-alt{
    color:var(--muted); font-size:1.05rem; font-weight:600;
    border-inline-start:3px solid var(--accent);
    padding-inline-start:12px; margin-top:6px;
  }
  html[dir="ltr"] .hero-alt{ font-family:'Noto Kufi Arabic',sans-serif; }
  .hero-desc{
    color:var(--card); opacity:.72; max-width:560px;
    margin-top:18px; line-height:1.65; font-size:.98rem;
  }
  .search{
    display:flex; align-items:center; gap:11px;
    max-width:560px; margin-top:26px;
    border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; background: rgba(220,225,230,.06);
    transition: border-color .2s, box-shadow .25s;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.28);
  }
  .search:focus-within{ border-color: var(--accent); box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 3px rgba(175,127,66,.18); }
  .search.live{ animation: searchPulse .9s ease-in-out infinite; }
  @keyframes searchPulse{
    0%,100%{ box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 0 rgba(175,127,66,.4); }
    50%{ box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 6px rgba(175,127,66,0); }
  }
  .search svg{ color: var(--muted); transition: color .25s; }
  .search.live svg{ color: var(--accent); animation: wobble 1s ease-in-out infinite; }
  @keyframes wobble{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-12deg); }
    75%{ transform: rotate(10deg); }
  }
  .search input{
    flex:1; background:none; border:none; outline:none;
    color:var(--card); font:inherit; font-size:.98rem; min-width:0;
  }
  .search input::placeholder{ color:var(--muted); }

  /* ============ Категории ============ */
  .cats{
    max-width:980px; margin:30px auto 0; padding:0 24px;
    display:flex; gap:9px; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--muted) transparent;
    touch-action: pan-x manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .cat-pill{
    flex-shrink:0; display:inline-flex; align-items:center; gap:9px;
    border:1px solid var(--line); border-radius:999px;
    background:none; color:var(--card);
    padding:9px 17px; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    white-space:nowrap; touch-action: manipulation;
  }
  .cat-pill .cnt{ font-size:.72rem; color:var(--muted); font-weight:500; }
  .cat-pill:hover{ border-color: var(--accent); }
  .cat-pill.on{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    border-color:var(--accent); color:var(--bg);
    box-shadow: 0 3px 0 var(--accent-lo), 0 10px 22px -6px rgba(175,127,66,.45);
  }
  .cat-pill.on .cnt{ color:var(--bg); opacity:.7; }
  .cat-pill:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .cat-pill.anim{ animation: fadeUp .45s both; }

  /* ============ Выбор города ============ */
  .cities{ max-width:980px; margin:30px auto 0; padding:0 24px; }
  .cities-head{ display:flex; flex-direction:column; gap:5px; margin-bottom:13px; }
  .cities-head h2{
    font-size: clamp(1.2rem, 2.8vw, 1.6rem); font-weight:800;
    display:flex; align-items:center; gap:10px;
    text-shadow: 0 3px 14px rgba(0,0,0,.4);
  }
  .cities-head h2 svg{ color:var(--accent); filter: drop-shadow(0 2px 8px rgba(175,127,66,.4)); }
  .cities-sub{ color:var(--muted); font-size:.84rem; font-weight:500; }
  .city-grid{
    display:grid; gap:9px;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  }
  .city-card{
    display:flex; flex-direction:column; gap:3px;
    background: rgba(220,225,230,.05);
    border:1px solid var(--line); border-radius:11px;
    padding:11px 13px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .5s both;
    min-width:0;
  }
  .city-card .cc-top{ display:flex; align-items:center; gap:8px; min-width:0; }
  .city-card .cc-pin{ color:var(--muted); transition: color .2s; flex-shrink:0; display:inline-flex; }
  .city-card .cc-name{
    font-size:.9rem; font-weight:700; color:var(--card);
    line-height:1.25; min-width:0; overflow-wrap: break-word;
  }
  .city-card .cc-cnt{
    font-size:.66rem; color:var(--accent); font-weight:700;
    margin-inline-start:auto; opacity:.9; flex-shrink:0;
  }
  .city-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 12px 26px -14px rgba(0,0,0,.55);
    background: rgba(175,127,66,.08);
  }
  .city-card:hover .cc-pin{ color: var(--accent); }
  .city-card:active{ transform: translateY(1px); }
  .city-card.on{
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(175,127,66,.17), rgba(175,127,66,.05));
    box-shadow: 0 6px 22px -10px rgba(175,127,66,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .city-card.on .cc-name{ color: var(--accent-hi); }
  .city-card.on .cc-pin{ color: var(--accent); }
  .no-city{ display:none !important; }
  #cats{ scroll-margin-top:80px; }

  /* ============ Подкатегории ============ */
  .subs{ max-width:980px; margin:14px auto 0; padding:0 24px; display:block; }
  .chip{
    background:none; border:1px solid var(--line); color:var(--card);
    border-radius:999px; padding:6px 13px;
    font-size:.8rem; font-weight:500; cursor:pointer;
    transition: border-color .2s, color .2s, background .2s, transform .15s;
    touch-action: manipulation;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{
    border-color:var(--accent); color:var(--accent);
    background:rgba(175,127,66,.14); font-weight:700;
    box-shadow: 0 3px 10px -4px rgba(175,127,66,.4);
  }
  .chip:active{ transform: scale(.96); }

  .level-cards{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
    gap:9px; margin-top:6px;
    width:100%;
  }
  .level-card{
    display:flex; flex-direction:column; gap:2px;
    background: rgba(220,225,230,.05);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s both;
    min-width:0;
  }
  .level-card .lc-top{ display:flex; align-items:center; gap:7px; min-width:0; }
  .level-card .lc-arrow{
    margin-inline-start:auto; color:var(--muted);
    transition: transform .2s, color .2s;
    opacity:.7;
  }
  .level-card .lc-title{ font-size:.88rem; font-weight:700; color:var(--card); line-height:1.22; min-width:0; }
  .level-card .lc-sub{ font-size:.66rem; color:var(--muted); font-weight:500; }
  .level-card .lc-cnt{
    font-size:.64rem; color:var(--accent); font-weight:700;
    display:inline-block; margin-top:3px;
  }
  .level-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.5);
    background: rgba(175,127,66,.08);
  }
  .level-card:hover .lc-arrow{ color: var(--accent); transform: translateX(3px); }
  html[dir="rtl"] .level-card:hover .lc-arrow{ transform: translateX(-3px); }
  .level-card.on{
    border-color: var(--accent2);
    background: rgba(184,115,79,.13);
    box-shadow: 0 5px 18px -10px rgba(184,115,79,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .level-card.on .lc-title{ color: var(--accent2); }
  .level-card.on .lc-arrow{ color: var(--accent2); }

  .subjects-block{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    animation: fadeUp .4s both;
  }
  .subjects-title{
    display:flex; align-items:center; gap:10px;
    font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted);
    flex-basis:100%; margin-bottom:2px;
  }
  html[dir="rtl"] .subjects-title{ text-transform:none; letter-spacing:0; }
  .subjects-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .subjects-title svg{ color: var(--accent); }

  .btn-add{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none;
    border-radius:9px; padding:9px 16px;
    font-size:.85rem; font-weight:700; cursor:pointer;
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.5);
    transition: filter .2s, transform .15s;
    touch-action: manipulation;
  }
  .btn-add:hover{ filter: brightness(1.08); }
  .btn-add:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-add.hidden{ display:none; }

  /* ============ Список ============ */
  .list-wrap{ max-width:980px; margin:38px auto 110px; padding:0 24px; perspective: 1600px; }
  .list-head{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:14px; border-bottom:2px solid var(--accent);
  }
  .list-head h2{ font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight:800; text-shadow: 0 3px 14px rgba(0,0,0,.4); }
  .list-head .cnt{ color:var(--muted); font-size:.85rem; font-weight:600; }
  .conn{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  html[dir="rtl"] .conn{ text-transform:none; letter-spacing:0; }
  .conn .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--muted); flex-shrink:0;
    transition: background .3s;
  }
  .conn.online .dot{ background: var(--accent); animation: pulse 2.2s infinite; }
  .conn.cache  .dot{ background: var(--accent2); }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(175,127,66,.55); }
    50%{ box-shadow:0 0 0 5px rgba(175,127,66,0); }
  }
  .sheet{
    background:var(--card); color:var(--bg);
    border-radius:16px; overflow:hidden; margin-top:6px;
    border-top:3px solid var(--accent);
    box-shadow: 0 30px 70px -25px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.5);
    transform-style: preserve-3d;
  }
  .row{
    display:grid;
    grid-template-columns: 60px minmax(0,1fr) auto;
    gap: 8px 22px;
    padding: 25px 22px;
    border-bottom: 1px solid var(--line-soft);
    position:relative;
    animation: fadeUp .45s both;
    transition: transform .22s ease, box-shadow .22s ease, background .25s;
    transform-style: preserve-3d;
    cursor:pointer;
  }
  .row:last-child{ border-bottom:none; }
  .row::before{
    content:""; position:absolute; inset-inline-start:0; top:0; bottom:0;
    width:3px; background:var(--accent); opacity:0; transition:opacity .2s;
  }
  .row:hover{
    background: rgba(175,127,66,.1);
    transform: translateY(-4px) rotateX(1.4deg);
    box-shadow: 0 22px 40px -18px rgba(0,0,0,.45), 0 0 0 1px rgba(175,127,66,.25);
  }
  .row:hover::before{ opacity:1; }
  .num{
    font-weight:800; font-size:1.35rem;
    color:var(--accent); opacity:.9; padding-top:2px;
    text-shadow: 0 2px 0 rgba(125,95,51,.25);
  }
  .row-body{ min-width:0; }
  .row-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .row-top h3{ font-size:1.12rem; font-weight:700; line-height:1.3; color:var(--bg); }
  .tag{
    background: rgba(175,127,66,.2); color: var(--bg);
    font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:5px; white-space:nowrap;
    box-shadow: inset 0 -1px 0 rgba(125,95,51,.35);
  }
  html[dir="rtl"] .tag{ text-transform:none; letter-spacing:0; }
  .row-desc{
    color:var(--muted); font-size:.9rem; line-height:1.55; margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row-meta{ display:flex; flex-wrap:wrap; gap:7px 24px; margin-top:12px; font-size:.9rem; }
  .row-meta span{ display:inline-flex; align-items:center; gap:7px; min-width:0; }
  .row-meta svg{ color: var(--accent); }
  .row-meta .loc{ color:var(--muted); }
  .row-actions{
    display:flex; flex-direction:column; gap:9px; justify-content:center; align-items:stretch;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:9px; padding:9px 15px;
    font-size:.83rem; font-weight:700; cursor:pointer;
    text-decoration:none; border:1px solid transparent;
    transition: filter .2s, background .2s, transform .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .btn:active{ transform: translateY(2px); }
  .btn-solid{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg);
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.4);
  }
  .btn-solid:hover{ filter:brightness(1.08); }
  .btn-solid:active{ box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-outline{ border-color:var(--accent); color:var(--bg); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
  .btn-outline:hover{ background:rgba(175,127,66,.15); }
  .btn-danger{ border-color:var(--accent2); color:var(--accent2); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-danger:hover{ background:rgba(184,115,79,.14); }
  .empty{ padding:64px 24px; text-align:center; color:var(--muted); }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty h4{ color:var(--bg); font-weight:700; margin-bottom:6px; font-size:1.05rem; }
  .empty p{ font-size:.9rem; max-width:340px; margin:0 auto; line-height:1.6; }

  .detail-tag{ display:inline-block; margin-bottom:12px; }
  .detail-desc{ color:var(--muted); line-height:1.6; margin:6px 0 14px; font-size:.95rem; }
  .detail-meta{ display:flex; flex-direction:column; gap:9px; margin:14px 0 18px; font-size:.95rem; }
  .detail-meta span{ display:inline-flex; align-items:center; gap:9px; }
  .detail-meta svg{ color: var(--muted); }
  .detail-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .detail-actions .btn{ flex:1; min-width:130px; }

  /* ============ Модалка подписки ============ */
  .plans{ display:flex; gap:10px; margin-top:6px; }
  .plan{
    flex:1; display:flex; flex-direction:column; gap:6px;
    background: #18202f;
    border:1px solid var(--accent); border-radius:12px;
    padding:16px 12px; cursor:pointer; text-align:center;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s both;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .plan:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px -10px rgba(0,0,0,.55);
    background: #1E2839;
  }
  .plan.on{
    background: #1E2839;
    border:2px solid var(--accent);
    box-shadow: 0 8px 22px -10px rgba(175,127,66,.55), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .plan-name{ font-size:.82rem; font-weight:700; color:#DCE1E6; }
  .plan-price{
    font-size:1.45rem; font-weight:800; color: var(--accent-hi);
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .plan-note{ font-size:.72rem; font-weight:600; color:#9BA8B6; }
  .agent-card{
    display:flex; align-items:center; gap:12px;
    margin-top:14px; padding:12px 14px;
    border:1px solid rgba(175,127,66,.35); border-radius:12px;
    background: linear-gradient(180deg, #1E2839, #18202f);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 18px -12px rgba(0,0,0,.6);
  }
  .agent-ic{
    width:40px; height:40px; border-radius:11px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background: rgba(175,127,66,.16); color: var(--accent-hi);
    border:1px solid rgba(175,127,66,.4);
  }
  .agent-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .agent-name{ font-size:.76rem; font-weight:600; color:#9BA8B6; line-height:1.45; }
  .agent-phone{
    color: var(--accent-hi); font-weight:800; font-size:.98rem;
    text-decoration:none; direction:ltr; unicode-bidi:isolate;
    display:inline-flex; align-items:center; gap:7px;
    width:fit-content; letter-spacing:.02em;
    transition: filter .2s, transform .15s;
  }
  .agent-phone:hover{ filter:brightness(1.2); transform: translateY(-1px); }
  .sub-hint{
    margin-top:14px; font-size:.72rem; color:var(--muted);
    line-height:1.5; text-align:center;
  }

  /* ============ Появление при скролле ============ */
  .reveal{ opacity:0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.vis{ opacity:1; transform:none; }

  /* ============ Футер: агент ============ */
  footer{
    border-top:1px solid var(--line);
    padding:26px 24px 110px; text-align:center;
    color:var(--muted); font-size:.8rem;
    line-height:1.7;
  }
  footer::before{
    content:""; position:absolute; top:-1px; left:12%; right:12%; height:1px;
    background: linear-gradient(90deg, transparent, rgba(175,127,66,.6), transparent);
  }
  .footer-agent{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .fa-line{ color:var(--card); opacity:.88; font-weight:600; font-size:.85rem; }
  .fa-addr{ font-size:.75rem; opacity:.75; max-width:620px; margin:0 auto; line-height:1.75; }
  .footer-phone{
    display:inline-flex; align-items:center; gap:7px;
    color: var(--accent); font-weight:700;
    text-decoration:none; font-size:1rem;
    direction:ltr; unicode-bidi:isolate;
    letter-spacing:.02em;
    transition: filter .2s, transform .15s;
  }
  .footer-phone:hover{ filter: brightness(1.25); text-decoration:underline; transform: translateY(-1px); }
  .footer-phone svg{ color: var(--accent); }
  .footer-note{ margin-top:16px; font-size:.72rem; opacity:.7; }

  /* ============ Плавающие кнопки ============ */
  .float-logout{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:60; display:none;
    align-items:center; gap:9px;
    background: linear-gradient(180deg, #C9855D, var(--accent2));
    color:var(--bg);
    border:none; border-radius:999px;
    padding:13px 22px; font-weight:700; font-size:.9rem; cursor:pointer;
    box-shadow: 0 4px 0 #8a5034, 0 16px 34px -6px rgba(0,0,0,.55);
    transition: filter .2s;
    touch-action: manipulation;
    max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .float-logout:hover{ filter:brightness(1.1); }
  .float-logout:active{ transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #8a5034; }
  .float-logout.show{ display:inline-flex; animation: fadeUp .35s both; }

  .float-sub{
    position:fixed; bottom:26px; inset-inline-end:26px;
    z-index:60;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none; border-radius:999px;
    padding:15px 22px; font-weight:800; font-size:.92rem; cursor:pointer;
    box-shadow: 0 4px 0 var(--accent-lo), 0 14px 30px -6px rgba(0,0,0,.55);
    transition: filter .2s, transform .15s;
    touch-action: manipulation;
    animation: subFloat 3.5s ease-in-out infinite;
  }
  .float-sub:hover{ filter: brightness(1.1); }
  .float-sub:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-lo); animation-play-state:paused; }
  .float-sub svg{ color: var(--bg); }
  @keyframes subFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  /* ============ Тосты ============ */
  #toastWrap{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    z-index:10050;
    display:flex; flex-direction:column; gap:9px; align-items:center;
    pointer-events:none; width:min(92vw, 480px);
  }
  .toast{
    background:var(--card); color:var(--bg);
    border-inline-start:4px solid var(--accent);
    border-radius:10px; padding:13px 20px;
    font-size:.9rem; font-weight:600;
    box-shadow: 0 18px 40px -10px rgba(0,0,0,.5);
    animation: fadeUp .3s both; max-width:100%;
    word-break: break-word;
  }
  .toast.err{ border-inline-start-color: var(--accent2); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }

  /* ============ Модальные окна ============ */
  .overlay{
    position:fixed; inset:0;
    z-index:9999;
    background:rgba(24,32,47,.55);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; opacity:0; pointer-events:none;
    transition: opacity .28s;
    touch-action: manipulation;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--card); color:var(--bg);
    width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
    border-radius:16px; padding:30px 28px;
    transform: translateY(16px) scale(.96) rotateX(2deg);
    transition: transform .28s;
    box-shadow: 0 50px 110px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.6);
    touch-action: manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show .modal{ transform:none; }
  .modal-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; padding-bottom:11px; border-bottom:1px solid var(--line-soft); }
  .modal-head h3{ font-size:1.3rem; font-weight:800; flex:1; line-height:1.25; color:var(--bg); }
  .modal-close{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:9px; border-radius:9px; display:flex; flex-shrink:0;
    touch-action: manipulation;
  }
  .modal-close:hover{ color:var(--accent2); background:rgba(104,116,138,.15); }
  .modal-close:active{ transform: scale(.92); }
  .modal-back{
    background:rgba(175,127,66,.14); color:var(--bg);
    border:1px solid var(--accent); border-radius:9px;
    padding:7px 14px 7px 10px; font-weight:700; font-size:.8rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    margin-bottom:14px;
    touch-action: manipulation;
    transition: background .2s, transform .15s;
  }
  .modal-back:hover{ background:rgba(175,127,66,.24); }
  .modal-back:active{ transform: scale(.96); }
  html[dir="rtl"] .modal-back{ padding:7px 10px 7px 14px; }
  .modal-desc{ color:var(--muted); font-size:.9rem; line-height:1.55; margin-bottom:22px; }

  .field{ margin-bottom:17px; }
  .field label{
    display:block; font-size:.72rem; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px;
  }
  html[dir="rtl"] .field label{ text-transform:none; }
  .field label .req{ color: var(--accent2); }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--bg); color: var(--card);
    border:1px solid transparent; border-radius:10px;
    padding:12px 14px; font:inherit; font-size:16px;
    outline:none; transition: border-color .2s, box-shadow .2s;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.3);
    touch-action: manipulation;
  }
  .field textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.3), 0 0 0 3px rgba(175,127,66,.18);
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--muted); }
  .field select{ appearance:none; cursor:pointer; }
  .counter{ text-align:end; font-size:.72rem; color:var(--muted); margin-top:5px; }
  .counter.over{ color:var(--accent2); font-weight:700; }

  /* ============ Маршруты (перевозки): выбор пункта Б тапом ============ */
  .route-pick{ display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  /* фон модалки светлый — базовый .chip (светлый текст) здесь невидим */
  .route-pick .chip{ padding:5px 12px; font-size:.78rem; color:var(--muted); }
  .route-pick .chip:hover{ color:var(--accent); }
  .route-pick .chip.on{ color:var(--accent); }
  /* Фильтр направлений в списке */
  .dest-filter{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0 2px; }
  .dest-label{ font-size:.8rem; color:var(--muted); font-weight:700; }
  .modal-actions{ display:flex; gap:11px; margin-top:24px; }
  .modal-actions .btn{ flex:1; padding:13px; font-size:.92rem; }

  .modal-submit{
    width:100%; margin-top:4px; padding:15px; font-size:1rem !important;
    touch-action: manipulation;
    min-height:52px;
  }
  .modal-submit:active{ transform: scale(.98); filter:brightness(1.15); }
  .modal-submit[disabled]{ opacity:.55; pointer-events:none; }

  .err-banner{
    display:none;
    background: var(--accent2); color: var(--card);
    border-radius:10px; padding:12px 16px;
    font-size:.88rem; font-weight:700;
    margin-bottom:18px; text-align:center;
    word-break: break-word;
    box-shadow: 0 6px 16px -6px rgba(184,115,79,.6);
  }
  .err-banner.show{ display:block; animation: fadeUp .3s both; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============ Полировка v15 ============ */
  ::selection{ background:rgba(175,127,66,.45); color:#fff; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  *{ scrollbar-width:thin; scrollbar-color:rgba(175,127,66,.45) transparent; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo)); border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .cat-pill .cnt{ background:rgba(104,116,138,.18); border-radius:99px; padding:2px 8px; }
  .cat-pill.on .cnt{ background:rgba(24,32,47,.22); }
  .cat-pill .cic{ display:inline-flex; color:var(--accent); }
  .cat-pill.on .cic{ color:var(--bg); }
  .cic svg{ display:block; }

  .num{
    background:linear-gradient(180deg,var(--accent-hi) 15%,var(--accent-lo) 90%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:none;
  }

  @keyframes floatSoft{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .empty svg{ animation:floatSoft 4.5s ease-in-out infinite; }

  .btn-solid{ position:relative; overflow:hidden; }
  .btn-solid::after{
    content:""; position:absolute; top:0; bottom:0; width:36%;
    inset-inline-start:-50%; transform:skewX(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transition:inset-inline-start .6s ease;
    pointer-events:none;
  }
  .btn-solid:hover::after{ inset-inline-start:120%; }

  html[lang="ku"] .hero-alt{ font-family:'Golos Text','Noto Sans',sans-serif; }
  .toast{ border-top:1px solid rgba(175,127,66,.25); }
  .sheet{ border:1px solid rgba(175,127,66,.14); }
  .modal{ border:1px solid rgba(175,127,66,.2); }

  /* ============ Мобильная версия ============ */
  @media (max-width: 760px){
    .moon-wrap{ display:none; }
    .r3{ width:180px; height:180px; top:-90px; inset-inline-end:-60px; }
    .shoot{ top:24%; left:76%; width:80px; }
    .shoot2{ top:14%; left:88%; width:60px; }

    body{ font-size:15px; }
    .topbar{ height:56px; padding:0 10px; gap:7px; }
    .brand{ font-size:.8rem; letter-spacing:.04em; gap:6px; }
    .brand svg{ width:20px; height:20px; }
    .brand-sub{ display:none; }
    .lang-switch button{ padding:7px 6px; font-size:.66rem; min-width:30px; }
    .topbar .btn-sub{ display:none; }
    .btn-admin{ padding:7px 9px; margin-inline-start:0; }
    .btn-admin .t{ display:none; }

    .hero{ padding:34px 14px 18px; }
    .hero h1{ font-size: clamp(1.55rem, 7.5vw, 2.1rem); gap:6px; }
    .hero-alt{ font-size:.9rem; }
    .hero-desc{ font-size:.9rem; margin-top:12px; }
    .search{ padding:10px 12px; font-size:.9rem; }

    .cube-stage{ width:32px; height:32px; }
    .cube{ width:32px; height:32px; }
    .cube .f1{ transform: translateZ(16px); }
    .cube .f2{ transform: rotateY(180deg) translateZ(16px); }
    .cube .f3{ transform: rotateY(90deg)  translateZ(16px); }
    .cube .f4{ transform: rotateY(-90deg) translateZ(16px); }
    .cube .f5{ transform: rotateX(90deg)  translateZ(16px); }
    .cube .f6{ transform: rotateX(-90deg) translateZ(16px); }

    .cats{ padding:0 14px; gap:7px; }
    .cat-pill{ padding:7px 12px; font-size:.8rem; }
    .cat-pill .cnt{ font-size:.66rem; }

    .subs{ padding:0 14px; }
    .cities{ padding:0 14px; margin-top:22px; }
    .cities-head h2{ font-size:1.12rem; }
    .cities-sub{ font-size:.78rem; }
    .city-grid{ grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap:7px; }
    .city-card{ padding:9px 11px; border-radius:10px; }
    .city-card .cc-name{ font-size:.8rem; }
    .chip{ padding:5px 11px; font-size:.74rem; }
    .level-cards{ grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap:7px; }
    .level-card{ padding:9px 10px; }
    .level-card .lc-title{ font-size:.8rem; }
    .subjects-block{ margin-top:12px; padding-top:10px; gap:6px; }

    .list-wrap{ margin:26px auto 130px; padding:0 14px; }
    .list-head h2{ font-size:1.15rem; }
    .row{ grid-template-columns: minmax(0,1fr); gap:12px; padding:18px 14px; }
    .row:hover{ transform: translateY(-2px); }
    .num{ display:none; }
    .row-top h3{ font-size:1rem; }
    .tag{ font-size:.62rem; max-width:100%; white-space:normal; }
    .row-desc{ font-size:.84rem; }

  const XLATE_LANGS = ["ar", "ru", "ku", "en"];
  async function xlateOne(text, tl) {
    const q = encodeURIComponent(text);
    /* 1) Google gtx: [[ ["перевод", ...], ... ], null, "src"] */
    try {
      const r = await withTimeout(fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${q}`), 7000);

        if (out) return out;

      const r = await withTimeout(fetch(`https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=${tl}&q=${q}`), 7000);

      }
    } catch {}
    return ""; /* нет перевода — карточка покажет исходное название */
  }

  }

  function applySnapshot(snap) {
    state.docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.docs.sort((a, b) => {
      const sa = (a.createdAt && a.createdAt.seconds) || 0;
      const sb = (b.createdAt && b.createdAt.seconds) || 0;
      return sb - sa;
    });
    renderAll();
    setConn(snap.metadata.fromCache ? "cache" : "online");
  }

  function startListener() {
    try {
      onSnapshot(collection(db, "providers"),
        snap => applySnapshot(snap),
        err => {
          console.error("Snapshot error:", err);
          setConn("cache");
          loadOnce();
        });
      listening = true;
    } catch (e) {
      console.error(e);
      loadOnce();
    }
  }

  async function loadOnce() {
    try {
      const snap = await withTimeout(getDocs(collection(db, "providers")), 15000);
      applySnapshot(snap);
    } catch (e) { console.error(e); }
  }

  async function dbAdd(data) {
    await withTimeout(
      addDoc(collection(db, "providers"), { ...data, createdAt: serverTimestamp() }), 20000);
    if (!listening) await loadOnce();
  }

  async function dbUpdate(id, data) {
    await withTimeout(
      updateDoc(doc(db, "providers", id), { ...data, updatedAt: serverTimestamp() }), 20000);
    if (!listening) await loadOnce();
  }

  async function dbRemove(id) {
    await withTimeout(deleteDoc(doc(db, "providers", id)), 20000);
    if (!listening) await loadOnce();
  }

  function filtered() {
    let items = state.docs.filter(d => d.group === state.level && inCity(d) && !isExpired(d));
    if (state.sub !== "all") items = items.filter(d => d.subcategory === state.sub);
    if (state.dest && state.dest !== "all") items = items.filter(d => Array.isArray(d.routes) && d.routes.includes(state.dest));
    if (state.search) {
      const q = state.search.toLowerCase();
      const qs = q.replace(/\s/g, "");
      const hits = citiesInQuery(state.search);
      const textMatch = (d) =>
        (d.title || "").toLowerCase().includes(q) ||
        (d.description || "").toLowerCase().includes(q) ||
        (d.phone || "").replace(/\s/g, "").includes(qs) ||
        (d.carMake || "").toLowerCase().includes(q) ||
        namesHit(d, q);
      const pairMode = hits.length >= 2; /* «Ракка - Алеппо»: явное направление */
      items = items.filter(d => {
        /* Перевозки — СТРОГО по направлению: пункт А = город анкеты,
           пункт Б = добавленные направления. Поиск «Ракка - Алеппо»
           показывает только анкеты с городом Ракка и пунктом Б Алеппо */
        if (d.subcategory === "transport" && hits.length) {
          const routes = Array.isArray(d.routes) ? d.routes : [];
          const from = docCityId(d);
          if (hits.length === 1) {
            const g = hits[0];
            return g === from || routes.includes(g);
          }
          /* 2+ города: направление по порядку упоминания:
             «Ракка - Алеппо» = из Ракки в Алеппо:
             пункт А анкеты = первый город, пункт Б = второй */
          for (let i = 0; i < hits.length; i++)
            for (let j = i + 1; j < hits.length; j++)
              if (hits[i] === from && routes.includes(hits[j])) return true;
          return false;
        }
        /* При явном направлении «откуда - куда» посторонние анкеты не показываются */
        return !pairMode && textMatch(d);
      });
    }
    /* Сортировка анкет перевозок по пункту А (городу анкеты):
       анкеты группируются по городам отправления */
    if (state.sub === "transport")
      items.sort((a, b) =>
        CITIES.findIndex(c => c.id === docCityId(a)) - CITIES.findIndex(c => c.id === docCityId(b)));
    return items;
  }

  /* ================= Счётчик просмотров анкеты ================= */
  /* +1 при каждом открытии карточки. Пишем напрямую в Firestore:
     правило update разрешает анониму менять ТОЛЬКО поле views и только +1.
     Сбой (правила/оффлайн) тихо игнорируется — посетителю ошибок не показываем */
  function countView(id) {
    updateDoc(doc(db, "providers", id), { views: increment(1) })
      .then(() => {
        const it = state.docs.find(d => d.id === id);
        if (it) it.views = (it.views || 0) + 1;
        renderList();
        if (state.detailId === id && $("detailOverlay").classList.contains("show")) renderDetail(id);
      })
      .catch(() => {});
  }

  function openDetail(id) {
    state.detailId = id;
    countView(id);
    renderDetail(id);
  }

  let loginBusy = false;
  async function doLogin() {
    if (loginBusy) return;
    const em = $("emailInput").value.trim();
    const pw = $("passInput").value.trim();
    if (!em || !pw) { banner($("loginErr"), "fillRequired"); return; }

    const btn = $("loginSubmitBtn");
    loginBusy = true;
    btn.disabled = true;
    btn.textContent = t("loginBusy");

    try {
      await withTimeout(signInWithEmailAndPassword(auth, em, pw), 15000);
      state.admin = true;
      syncAdminUI();
      closeOv("loginOverlay");
      toast(t("toastWelcome"));
    } catch (err) {
      console.error("Auth error:", err && err.code, err && err.message);
      bannerMsg($("loginErr"), authErrText(err && err.code));
    } finally {
      loginBusy = false;
      btn.disabled = false;
      btn.textContent = t("login");
    }
  }

  $("loginSubmitBtn").addEventListener("click", doLogin);
  $("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
  $("passInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  $("emailInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); $("passInput").focus(); }

    syncLevelSelect();
  }
  function syncLevelSelect() {
    const cat = catById($("fCat").value);
    if (cat.levels) {
      $("fLevelField").hidden = false;
      $("fLevel").innerHTML = cat.levels.map(l =>
        `<option value="${l.id}"${state.level === l.id ? " selected" : ""}>${esc(levelName(l))}</option>`).join("");
    } else {
      $("fLevelField").hidden = true;
      $("fLevel").innerHTML = "";
    }
    fillSubSelect();
  }
  function fillSubSelect() {
    const cat = catById($("fCat").value);
    const lv = cat.levels
      ? (cat.levels.find(l => l.id === $("fLevel").value) || cat.levels[0])
      : levelsOf(cat)[0];
    $("fSub").innerHTML = lv.subs.map(s =>
      `<option value="${s.id}">${esc(nm(s))}</option>`).join("");
    updateLocLabel();
  }
  function updateLocLabel() {
    const cat = catById($("fCat").value);
    if (!cat) return; /* селекты ещё не заполнены — нечего синхронизировать */
    const subcat = $("fSub").value;
    const must = needsLocation(cat, subcat);
    $("fLocLabel").innerHTML = esc(t("fLocation")) + (must ? ' <span class="req">*</span>' : "");
    $("fTitle").placeholder = t(cat.base === "stores" || cat.base === "pharmacies" ? "fTitleStore"
                              : cat.base === "repair" ? "fTitleRepair"
                              : cat.base === "services" ? "fTitleVenue"
                              : "fTitlePerson");
    const isTransport = subcat === "transport";
    $("fCarField").hidden = !isTransport;
    $("fCarLabel").innerHTML = esc(t("carMake")) + (isTransport ? ' <span class="req">*</span>' : "");
    if (!isTransport) $("fCar").value = "";
    syncRoutesUI();
  }

  /* ============ Маршруты (перевозки): пункт А = город карточки (автоматически,
     выбирается выше в поле «Город»), пункт Б — тап по городам ниже ============ */
  function syncRoutesUI() {
    const subcat = $("fSub").value;
    const isTransport = subcat === "transport";
    $("fRoutesField").hidden = !isTransport;
    if (!isTransport) return;
    const city = $("fCity").value;
    if (formRoutes.includes(city)) formRoutes = formRoutes.filter(id => id !== city);
    $("fRoutesPick").innerHTML = CITIES.filter(c => c.id !== city).map(c =>
      `<button type="button" class="chip${formRoutes.includes(c.id) ? " on" : ""}" data-route="${c.id}">${esc(nm(c))}</button>`).join("");
  }
  $("fCat").addEventListener("change", syncLevelSelect);
  $("fLevel").addEventListener("change", fillSubSelect);
  $("fSub").addEventListener("change", updateLocLabel);
  $("fCity").addEventListener("change", syncRoutesUI);
  /* Пункт Б: тап по городу добавляет/убирает направление (повторный тап — снимает) */
  $("fRoutesPick").addEventListener("click", e => {
    const b = e.target.closest("[data-route]");
    if (!b) return;
    const id = b.dataset.route;
    if (formRoutes.includes(id)) {
      formRoutes = formRoutes.filter(x => x !== id);
      b.classList.remove("on");
    } else {
      formRoutes.push(id);
      b.classList.add("on");
    }
  });

  $("fDesc").addEventListener("input", () => {
    const n = $("fDesc").value.length;
    const c = $("descCounter");
    c.textContent = `${n} / 600`;
    c.classList.toggle("over", n > 600);
  });

  function openAddModal() {
    editingId = null;
    formRoutes = [];
    $("addModalTitle").textContent = t("addTitle");
    $("addForm").reset();
    $("addErr").classList.remove("show");
    $("descCounter").textContent = "0 / 600";
    $("descCounter").classList.remove("over");
    fillCatSelect();
    /* Подкатегория предвыбрана из текущего раздела: из «Перевозок меж городов»
       анкета перевозок создаётся сразу — с уже открытым выбором пунктов Б */
    if (state.sub !== "all" && Array.from($("fSub").options).some(o => o.value === state.sub)) {
      $("fSub").value = state.sub;
      updateLocLabel();
    }
    openOv("addOverlay");
  }

  function openEditModal(id) {
    const d = state.docs.find(x => x.id === id);
    if (!d) return;
    editingId = id;
    formRoutes = [];   /* сброс: старые маршруты не должны утечь в чужую анкету */
    $("addModalTitle").textContent = t("editTitle");
    $("addForm").reset();
    $("addErr").classList.remove("show");
    $("descCounter").textContent = "0 / 600";
    $("descCounter").classList.remove("over");
    fillCatSelect();
    $("fCity").value = d.city || "raqqa";
    const cat = CATS.find(c => c.base === (d.category || d.group)) || catById(state.cat);
    $("fCat").value = cat.id;
    syncLevelSelect();
    if (cat.levels) $("fLevel").value = d.group || cat.levels[0].id;
    fillSubSelect();
    const subOpts = Array.from($("fSub").options).map(o => o.value);
    if (subOpts.includes(d.subcategory)) $("fSub").value = d.subcategory;
    updateLocLabel();
    if (d.subcategory === "transport" && Array.isArray(d.routes)) {
      formRoutes = d.routes.filter(id => CITIES.some(c => c.id === id));
      syncRoutesUI(); /* перерисовать пункты Б с уже выбранными */
    }
    $("fTitle").value = d.title || "";
    $("fPhone").value = d.phone || "";
    $("fLoc").value = d.location || "";
    if (d.subcategory === "transport") $("fCar").value = d.carMake || "";
    $("fDesc").value = d.description || "";
    $("descCounter").textContent = `${$("fDesc").value.length} / 600`;
    openOv("addOverlay");
  }

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cat = catById($("fCat").value);
    const groupId = cat.levels ? $("fLevel").value : cat.id;
    const subcat = $("fSub").value;
    const title = $("fTitle").value.trim();
    const phone = $("fPhone").value.trim();
    const location = $("fLoc").value.trim();
    const carMake = $("fCar").value.trim();
    const description = $("fDesc").value.trim();
    const ttlMs = Number($("fExp").value) || 2592000000;
    const city = $("fCity").value;

    if (!city) { banner($("addErr"), "fillRequired"); return; }
    if (!title || !phone || !groupId) { banner($("addErr"), "fillRequired"); return; }
    if (needsLocation(cat, subcat) && !location) { banner($("addErr"), "locRequired"); return; }
    const routes = subcat === "transport" ? formRoutes.slice() : [];
    if (subcat === "transport" && !routes.length) { banner($("addErr"), "routeRequired"); return; }
    if (subcat === "transport" && !carMake) { banner($("addErr"), "carMakeRequired"); return; }
    if (description.length > 600) { banner($("addErr"), "descLimit"); return; }

    /* Автоперевод названия на 4 языка (кэш при правке без смены названия);
       сбой сети не блокирует сохранение */
    const saveBtn = $("addForm").querySelector('button[type="submit"]');
    const saveTxt = saveBtn.textContent;
    let names = null;
    try {
      if (editingId) {
        const orig0 = state.docs.find(x => x.id === editingId);
        if (orig0 && orig0.names && orig0.title === title) names = orig0.names;
      }
      if (!names) {
        saveBtn.disabled = true;
        saveBtn.textContent = t("translating");
        names = await translateName(title);
      }
    } catch {}
    saveBtn.disabled = false;
    saveBtn.textContent = saveTxt;

    try {
      const payload = {
        type: cat.base === "stores" || cat.base === "pharmacies" ? "store"
             : cat.base === "services" || cat.base === "repair" ? "service" : "person",
        category: cat.base,
        group: groupId,
        subcategory: subcat,
        city,
        carMake: subcat === "transport" ? carMake : "",
        routes,
        title, phone, location, description
      };
      /* names — карта автопереводов; при правке со сменой названия и сбоем
         перевода убираем устаревшие варианты, чтобы не показывать чужие имена */
      if (names) payload.names = names;
      else if (editingId && (state.docs.find(x => x.id === editingId) || {}).names) payload.names = deleteField();
      if (editingId) {
        /* Правка: активную карточку не пересоздаём — срок хранения сохраняем,
           просроченную (или без даты) — продлеваем на выбранный период */
        const orig = state.docs.find(x => x.id === editingId);
        const expired = !orig || !orig.expiresAt || orig.expiresAt <= Date.now();
        payload.expiresAt = expired ? Date.now() + ttlMs : orig.expiresAt;
        await dbUpdate(editingId, payload);
        /* Мгновенно отражаем правку в списке: если менялся город — анкета
           переезжает в новый раздел сразу, не дожидаясь снапшота Firestore */
        const idx = state.docs.findIndex(x => x.id === editingId);
        if (idx !== -1) state.docs[idx] = { ...state.docs[idx], ...payload };
        renderAll();
        closeOv("addOverlay");
        toast(t("toastUpdated"));
      } else {
        payload.expiresAt = Date.now() + ttlMs;
        await dbAdd(payload);
        closeOv("addOverlay");
        toast(t("toastAdded"));
      }
      editingId = null;
      $("addModalTitle").textContent = t("addTitle");
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err");
    }
  });

  /* ================= Удаление / редактирование ================= */
  $("list").addEventListener("click", e => {
    const del = e.target.closest(".row-del");
    if (del) {
      pendingDeleteId = del.dataset.id;
      const p = state.docs.find(d => d.id === pendingDeleteId);
      $("confirmText").textContent = t("confirmDesc").replace("{title}", p ? pname(p) : "");
      openOv("confirmOverlay");
      return;
    }
    const editBtn = e.target.closest(".row-edit");
    if (editBtn) openEditModal(editBtn.dataset.id);
  });

  $("confirmDeleteBtn").addEventListener("click", async () => {
    if (!pendingDeleteId) return;
    try {
      await dbRemove(pendingDeleteId);
      toast(t("toastDeleted"));
      if (state.detailId === pendingDeleteId) { closeOv("detailOverlay"); state.detailId = null; }
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err");
    }
    pendingDeleteId = null;
    closeOv("confirmOverlay");
  });

  /* ================= Навигация ================= */
  $("cityGrid").addEventListener("click", e => {
    const b = e.target.closest(".city-card");
    if (!b || state.city === b.dataset.city) return;
    state.city = b.dataset.city;
    store.set("dalil_city", state.city);
    state.dest = "all";
    animCities = false;
    renderCities();
    updateCityVisibility();
    renderAll();
    setTimeout(() => { try { $("cats").scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }, 80);
  });

  $("cats").addEventListener("click", e => {
    const b = e.target.closest(".cat-pill");
    if (!b) return;
    state.cat = b.dataset.cat;
    const cat = catById(state.cat);
    state.level = levelsOf(cat)[0].id;
    state.sub = "all";
    state.dest = "all";
    state.levelSelected = !cat.levels;
    renderCats(); renderSubs(); renderList();
  });

  $("subs").addEventListener("click", e => {
    state.dest = "all";
    const subcard = e.target.closest("[data-subcard]");
    if (subcard) { state.sub = subcard.dataset.subcard; renderSubs(); renderList(); return; }
    const lvl = e.target.closest("[data-level]");
    if (lvl) {
      state.level = lvl.dataset.level;
      state.sub = "all";
      state.levelSelected = true;
      renderSubs(); renderList();
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) { state.sub = chip.dataset.sub; renderSubs(); renderList(); return; }
    if (e.target.closest("#addCardBtn")) openAddModal();
  });

  $("destFilter").addEventListener("click", e => {
    const chip = e.target.closest("[data-dest]");
    if (!chip) return;
    state.dest = chip.dataset.dest;
    renderDestFilter();
    renderList();
  });

  $("searchInput").addEventListener("input", e => {
    state.search = e.target.value.trim();
    $("searchBox").classList.toggle("live", !!state.search);
    renderList();
  });

  $("langRu").addEventListener("click", () => setLang("ru"));
  $("langAr").addEventListener("click", () => setLang("ar"));
  $("langEn").addEventListener("click", () => setLang("en"));
  $("langKu").addEventListener("click", () => setLang("ku"));
  function setLang(l) {
    if (state.lang === l) return;
    state.lang = l;
    store.set("dalil_lang", l);
    applyLang();
  }

  /* ============ Скролл-анимации и параллакс ============ */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("vis"); });
  }, { threshold: .12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  const moonEl = $("moon");
  window.addEventListener("scroll", () => {
    moonEl.style.transform = `translateY(${window.scrollY * -0.18}px)`;
  }, { passive: true });

  /* ================= Инициализация ================= */
  (async function init() {
    try {
      $("adminBtn").querySelector(".ic").innerHTML = icon("lock", 15);
      $("searchIcon").innerHTML = icon("search", 18);
      $("logoutIcon").innerHTML = icon("logout", 16);
      $("citiesIcon").innerHTML = icon("city", 22);
      $("agentIc").innerHTML = icon("user", 20);
      document.querySelectorAll(".modal-close").forEach(b => b.innerHTML = icon("x", 18));

      state.levelSelected = !catById(state.cat).levels;
      applyLang();
      renderAll();
      updateCityVisibility();
      startListener();
    } catch (e) {
      console.error(e);
      toast("⚠ " + (e.message || "خطأ في التهيئة"), "err");
    }
  })();
</script>
</body>
</html>
