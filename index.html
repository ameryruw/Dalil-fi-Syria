<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>دليل سوريا · DALIL SURIYA — Справочник Сирии</title>
<script>
  /* Тема до первой отрисовки — без вспышки тёмного фона у выбравших светлую */
  try { if (localStorage.getItem("dalil_theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 1.5 21.5 7v10L12 22.5 2.5 17V7z' fill='none' stroke='%23AF7F42' stroke-width='2'/><path d='M12 7l4.5 2.6v5.2L12 17.5l-4.5-2.7V9.6z' fill='%23AF7F42'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #18202f;
    --muted: #68748A;
    --card: #DCE1E6;
    --accent: #AF7F42;
    --accent2: #B8734F;
    --accent-hi: #C2924F;
    --accent-lo: #7D5F33;
    --line: rgba(104,116,138,.35);
    --line-soft: rgba(104,116,138,.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; overflow-x:hidden; }
  button:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  ::selection{ background:rgba(175,127,66,.5); color:#fff; }
  ::-webkit-scrollbar{ width:10px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(104,116,138,.35); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(175,127,66,.5); }
  html[dir="rtl"] body{ font-family:'Noto Kufi Arabic','Golos Text',sans-serif; }
  html[dir="rtl"] *{ letter-spacing:normal !important; }
  body{
    background: var(--bg);
    color: var(--card);
    font-family: 'Golos Text','Noto Sans','Noto Kufi Arabic',sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
  }
  button{ font: inherit; touch-action: manipulation; }
  svg{ flex-shrink:0; }
  h1, h2, h3, p, span, button, .tag, .chip{ overflow-wrap: break-word; }
  /* Атрибут hidden сильнее любых display из классов — иначе display:flex у .dest-filter перебивает hidden, и фильтр виден во всех разделах */
  [hidden]{ display:none !important; }
  .hero, .cats, .subs, .list-wrap, footer{ position:relative; }

  /* Телефон и числа в RTL: всегда слева направо */
  html[dir="rtl"] .ltr-num{ direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:7px; }
  html[dir="rtl"] .ltr-num > span{ direction:ltr; unicode-bidi:isolate; }

  /* ============ Фон: месяц (маска), орбиты, искры, мерцание, падающие звёзды ============ */
  .bg-deco{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .moon-wrap{
    position:absolute; top:78px; inset-inline-end:5%;
    width:170px; height:170px;
    will-change:transform;
  }
  .moon{
    position:relative; width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle at 38% 34%, #F6E3B8, var(--accent) 72%);
    /* настоящий месяц: вырез через маску — прозрачный серп, без чёрного круга */
    -webkit-mask: radial-gradient(circle at 66% 28%, transparent 0 46%, #000 47%);
    mask: radial-gradient(circle at 66% 28%, transparent 0 46%, #000 47%);
    /* усиленное свечение по форме месяца */
    filter: drop-shadow(0 0 20px rgba(175,127,66,.6)) drop-shadow(0 0 70px rgba(175,127,66,.35));
    animation: floaty 9s ease-in-out infinite;
    will-change: transform;
  }
  .ring{
    position:absolute; border-radius:50%;
    border:1px dashed rgba(175,127,66,.16);
    animation: spin 70s linear infinite;
  }
  .r1{ bottom:-220px; inset-inline-start:-170px; width:520px; height:520px; }
  .r2{ bottom:-120px; inset-inline-start:-70px; width:300px; height:300px;
       border-color: rgba(104,116,138,.14); animation-duration:52s; animation-direction:reverse; }
  .r3{ top:-130px; inset-inline-end:-90px; width:280px; height:280px;
       border-color: rgba(175,127,66,.12); animation-duration:64s; animation-direction:reverse; }
  .spark{
    position:absolute; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px rgba(175,127,66,.55);
    animation: drift 16s linear infinite;
  }
  .s1{ width:5px; height:5px; top:24%; inset-inline-start:10%; }
  .s2{ width:3px; height:3px; top:46%; inset-inline-start:22%; animation-duration:21s; animation-delay:-6s; }
  .s3{ width:4px; height:4px; top:64%; inset-inline-start:8%;  animation-duration:13s; animation-delay:-3s; }
  .s4{ width:3px; height:3px; top:14%; inset-inline-start:42%; animation-duration:18s; animation-delay:-9s; }
  .s5{ width:5px; height:5px; top:78%; inset-inline-start:36%; animation-duration:15s; animation-delay:-5s; }
  .s6{ width:3px; height:3px; top:34%; inset-inline-start:64%; animation-duration:19s; animation-delay:-12s; opacity:.4; }
  /* мерцающие звёзды */
  .tw{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#E8CB9C;
    box-shadow: 0 0 8px 2px rgba(232,203,156,.5);
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .tw1{ top:12%; inset-inline-start:28%; }
  .tw2{ top:32%; inset-inline-start:56%; animation-delay:-1.1s; }
  .tw3{ top:70%; inset-inline-start:16%; animation-delay:-2.2s; width:5px; height:5px; }
  /* падающие звёзды с хвостом */
  .shoot{
    position:absolute; top:18%; left:68%;
    width:110px; height:2px; border-radius:2px;
    background: linear-gradient(90deg, transparent, rgba(240,213,168,.95));
    transform: rotate(-35deg);
    opacity:0;
    animation: shoot 11s ease-in infinite;
  }
  .shoot2{
    top:8%; left:84%; width:80px;
    transform: rotate(-28deg);
    animation: shoot 13s ease-in infinite;
    animation-delay: 5.5s;
  }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-16px); } }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:.65; } 85%{ opacity:.3; }
    100%{ transform:translate(46px,-130px); opacity:0; }
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.7); }
    50%{ opacity:.9; transform:scale(1.15); }
  }
  @keyframes shoot{
    0%{ transform:translate(0,0) rotate(-35deg); opacity:0; }
    3%{ opacity:1; }
    12%{ transform:translate(-380px,250px) rotate(-35deg); opacity:0; }
    100%{ transform:translate(-380px,250px) rotate(-35deg); opacity:0; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ 3D-куб ============ */
  .cube-stage{
    width:54px; height:54px;
    perspective: 340px;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cube{
    position:relative; width:54px; height:54px;
    transform-style: preserve-3d;
    animation: cubeSpin 14s linear infinite;
  }
  @keyframes cubeSpin{
    from{ transform: rotateX(-18deg) rotateY(0deg); }
    to  { transform: rotateX(-18deg) rotateY(360deg); }
  }
  .cube .face{
    position:absolute; inset:0;
    border:1.5px solid var(--accent);
    border-radius:9px;
    background: rgba(175,127,66,.13);
    box-shadow: inset 0 0 18px rgba(175,127,66,.28);
  }
  .cube .f1{ transform: translateZ(27px); }
  .cube .f2{ transform: rotateY(180deg) translateZ(27px); }
  .cube .f3{ transform: rotateY(90deg)  translateZ(27px); }
  .cube .f4{ transform: rotateY(-90deg) translateZ(27px); }
  .cube .f5{ transform: rotateX(90deg)  translateZ(27px); }
  .cube .f6{ transform: rotateX(-90deg) translateZ(27px); }

  /* ============ Шапка ============ */
  .topbar{
    position: sticky; top:0; z-index:50;
    background: rgba(24,32,47,.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    height:64px; padding:0 24px;
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    font-weight:800; font-size:1.05rem; letter-spacing:.12em; color:var(--card);
    text-decoration:none; white-space:nowrap;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
    min-width:0;
  }
  .brand svg{ color: var(--accent); filter: drop-shadow(0 2px 6px rgba(175,127,66,.5)); }
  .brand-sub{
    font-family:'Noto Kufi Arabic',sans-serif;
    font-weight:400; font-size:.8rem; color:var(--muted);
    letter-spacing:0; align-self:flex-end; padding-bottom:2px;
  }
  html[dir="rtl"] .brand{ font-family:'Golos Text',sans-serif; }
  .btn-sub{
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none;
    border-radius:9px; padding:8px 14px; font-size:.8rem; font-weight:800;
    cursor:pointer; white-space:nowrap; touch-action: manipulation; flex-shrink:0;
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.5);
    transition: filter .2s, transform .18s, box-shadow .18s;
  }
  .btn-sub:hover{ filter: brightness(1.08); }
  .btn-sub:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-admin{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--accent); color:var(--accent);
    border-radius:9px; padding:8px 15px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition: background .2s, transform .18s, box-shadow .18s;
    white-space:nowrap; touch-action: manipulation; flex-shrink:0;
  }
  .btn-admin:hover{ background: rgba(175,127,66,.16); }
  .btn-admin:active{ transform: scale(.96); }

  /* ============ Hero ============ */
  .hero{ max-width: 980px; margin:0 auto; padding: 62px 24px 26px; }
  .hero-meta{
    color:var(--muted); font-size:.72rem; font-weight:600;
    letter-spacing:.28em; text-transform:uppercase;
    display:flex; align-items:center; gap:14px;
  }
  html[dir="rtl"] .hero-meta{ letter-spacing:0; }
  .hero-meta::after{ content:""; flex:1; height:1px; background:var(--line); }
  .hero h1{
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    font-weight:800; line-height:1.15; margin:14px 0 4px;
    text-shadow: 0 4px 22px rgba(0,0,0,.45);
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .hero h1 em{ font-style:normal; color:var(--accent); text-shadow: 0 0 26px rgba(175,127,66,.4); }
  .hero-alt{
    color:var(--muted); font-size:1.05rem; font-weight:600;
    border-inline-start:3px solid var(--accent);
    padding-inline-start:12px; margin-top:6px;
  }
  html[dir="ltr"] .hero-alt{ font-family:'Noto Kufi Arabic',sans-serif; }
  .hero-desc{
    color:var(--card); opacity:.72; max-width:560px;
    margin-top:18px; line-height:1.65; font-size:.98rem;
  }
  .search{
    display:flex; align-items:center; gap:11px;
    max-width:560px; margin-top:26px;
    border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; background: rgba(220,225,230,.06);
    transition: border-color .2s, box-shadow .25s;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.28);
  }
  .search:focus-within{ border-color: var(--accent); box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 3px rgba(175,127,66,.18); }
  .search.live{ animation: searchPulse .9s ease-in-out infinite; }
  @keyframes searchPulse{
    0%,100%{ box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 0 rgba(175,127,66,.4); }
    50%{ box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 6px rgba(175,127,66,0); }
  }
  .search svg{ color: var(--muted); transition: color .25s; }
  .search.live svg{ color: var(--accent); animation: wobble 1s ease-in-out infinite; }
  @keyframes wobble{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-12deg); }
    75%{ transform: rotate(10deg); }
  }
  .search input{
    flex:1; background:none; border:none; outline:none;
    color:var(--card); font:inherit; font-size:.98rem; min-width:0;
  }
  .search input::placeholder{ color:var(--muted); }

  /* ============ Категории ============ */
  .cats{
    max-width:980px; margin:30px auto 0; padding:0 24px;
    display:flex; gap:9px; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--muted) transparent;
    touch-action: pan-x manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .cat-pill{
    flex-shrink:0; display:inline-flex; align-items:center; gap:9px;
    border:1px solid var(--line); border-radius:999px;
    background:none; color:var(--card);
    padding:9px 17px; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    white-space:nowrap; touch-action: manipulation;
  }
  .cat-pill .cnt{ font-size:.72rem; color:var(--muted); font-weight:500; }
  .cat-pill:hover{ border-color: var(--accent); }
  .cat-pill.on{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    border-color:var(--accent); color:var(--bg);
    box-shadow: 0 3px 0 var(--accent-lo), 0 10px 22px -6px rgba(175,127,66,.45);
  }
  .cat-pill.on .cnt{ color:var(--bg); opacity:.7; }
  .cat-pill:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .cat-pill.anim{ animation: fadeUp .45s backwards; }

  /* ============ Выбор города ============ */
  .cities{ max-width:980px; margin:30px auto 0; padding:0 24px; }
  .cities-head{ display:flex; flex-direction:column; gap:5px; margin-bottom:13px; }
  .cities-head h2{
    font-size: clamp(1.2rem, 2.8vw, 1.6rem); font-weight:800;
    display:flex; align-items:center; gap:10px;
    text-shadow: 0 3px 14px rgba(0,0,0,.4);
  }
  .cities-head h2 svg{ color:var(--accent); filter: drop-shadow(0 2px 8px rgba(175,127,66,.4)); }
  .cities-sub{ color:var(--muted); font-size:.84rem; font-weight:500; }
  .city-grid{
    display:grid; gap:9px;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  }
  .city-card{
    display:flex; flex-direction:column; gap:3px;
    background: rgba(220,225,230,.05);
    border:1px solid var(--line); border-radius:11px;
    padding:11px 13px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .5s backwards;
    min-width:0;
  }
  .city-card .cc-top{ display:flex; align-items:center; gap:8px; min-width:0; }
  .city-card .cc-pin{ color:var(--muted); transition: color .2s; flex-shrink:0; display:inline-flex; }
  .city-card .cc-name{
    font-size:.9rem; font-weight:700; color:var(--card);
    line-height:1.25; min-width:0; overflow-wrap: break-word;
  }
  .city-card .cc-cnt{
    font-size:.66rem; color:var(--accent); font-weight:700;
    margin-inline-start:auto; opacity:.9; flex-shrink:0;
  }
  .city-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 12px 26px -14px rgba(0,0,0,.55);
    background: rgba(175,127,66,.08);
  }
  .city-card:hover .cc-pin{ color: var(--accent); }
  .city-card:active{ transform: translateY(1px); }
  .city-card.on{
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(175,127,66,.17), rgba(175,127,66,.05));
    box-shadow: 0 6px 22px -10px rgba(175,127,66,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .city-card.on .cc-name{ color: var(--accent-hi); }
  .city-card.on .cc-pin{ color: var(--accent); }
  .no-city{ display:none !important; }
  #cats{ scroll-margin-top:80px; }

  /* ============ Подкатегории ============ */
  .subs{ max-width:980px; margin:14px auto 0; padding:0 24px; display:block; }
  .chip{
    background:none; border:1px solid var(--line); color:var(--card);
    border-radius:999px; padding:6px 13px;
    font-size:.8rem; font-weight:500; cursor:pointer;
    transition: border-color .2s, color .2s, background .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{
    border-color:var(--accent); color:var(--accent);
    background:rgba(175,127,66,.14); font-weight:700;
    box-shadow: 0 3px 10px -4px rgba(175,127,66,.4);
  }
  .chip:active{ transform: scale(.96); }

  .level-cards{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
    gap:9px; margin-top:6px;
    width:100%;
  }
  .level-card{
    display:flex; flex-direction:column; gap:2px;
    background: rgba(220,225,230,.05);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s backwards;
    min-width:0;
  }
  .level-card .lc-top{ display:flex; align-items:center; gap:7px; min-width:0; }
  .level-card .lc-arrow{
    margin-inline-start:auto; color:var(--muted);
    transition: transform .2s, color .2s;
    opacity:.7;
  }
  .level-card .lc-title{ font-size:.88rem; font-weight:700; color:var(--card); line-height:1.22; min-width:0; }
  .level-card .lc-sub{ font-size:.66rem; color:var(--muted); font-weight:500; }
  .level-card .lc-cnt{
    font-size:.64rem; color:var(--accent); font-weight:700;
    display:inline-block; margin-top:3px;
  }
  .level-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.5);
    background: rgba(175,127,66,.08);
  }
  .level-card:hover .lc-arrow{ color: var(--accent); transform: translateX(3px); }
  html[dir="rtl"] .level-card:hover .lc-arrow{ transform: translateX(-3px); }
  .level-card.on{
    border-color: var(--accent2);
    background: rgba(184,115,79,.13);
    box-shadow: 0 5px 18px -10px rgba(184,115,79,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .level-card.on .lc-title{ color: var(--accent2); }
  .level-card.on .lc-arrow{ color: var(--accent2); }

  .subjects-block{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    animation: fadeUp .4s backwards;
  }
  .subjects-title{
    display:flex; align-items:center; gap:10px;
    font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted);
    flex-basis:100%; margin-bottom:2px;
  }
  html[dir="rtl"] .subjects-title{ text-transform:none; letter-spacing:0; }
  .subjects-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .subjects-title svg{ color: var(--accent); }

  .btn-add{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none;
    border-radius:9px; padding:9px 16px;
    font-size:.85rem; font-weight:700; cursor:pointer;
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.5);
    transition: filter .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
  }
  .btn-add:hover{ filter: brightness(1.08); }
  .btn-add:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-add.hidden{ display:none; }

  /* ============ Список ============ */
  .list-wrap{ max-width:980px; margin:38px auto 110px; padding:0 24px; perspective: 1600px; }
  .list-head{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:14px; border-bottom:2px solid var(--accent);
  }
  .list-head h2{ font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight:800; text-shadow: 0 3px 14px rgba(0,0,0,.4); }
  .list-head .cnt{ color:var(--muted); font-size:.85rem; font-weight:600; }
  .conn{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  html[dir="rtl"] .conn{ text-transform:none; letter-spacing:0; }
  .conn .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--muted); flex-shrink:0;
    transition: background .3s;
  }
  .conn.online .dot{ background: var(--accent); animation: pulse 2.2s infinite; }
  .conn.cache  .dot{ background: var(--accent2); }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(175,127,66,.55); }
    50%{ box-shadow:0 0 0 5px rgba(175,127,66,0); }
  }
  .sheet{
    background:var(--card); color:var(--bg);
    border-radius:16px; overflow:hidden; margin-top:6px;
    border-top:3px solid var(--accent);
    box-shadow: 0 30px 70px -25px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.5);
    transform-style: preserve-3d;
  }
  .row{
    display:grid;
    grid-template-columns: 60px minmax(0,1fr) auto;
    gap: 8px 22px;
    padding: 25px 22px;
    border-bottom: 1px solid var(--line-soft);
    position:relative;
    animation: fadeUp .45s backwards;
    transition: transform .22s ease, box-shadow .22s ease, background .25s;
    transform-style: preserve-3d;
    cursor:pointer;
  }
  .row:last-child{ border-bottom:none; }
  .row::before{
    content:""; position:absolute; inset-inline-start:0; top:0; bottom:0;
    width:3px; background:var(--accent); opacity:0; transition:opacity .2s;
  }
  .row:hover{
    background: rgba(175,127,66,.1);
    transform: translateY(-4px) rotateX(1.4deg);
    box-shadow: 0 22px 40px -18px rgba(0,0,0,.45), 0 0 0 1px rgba(175,127,66,.25);
  }
  .row:hover::before{ opacity:1; }
  .num{
    font-weight:800; font-size:1.35rem;
    color:var(--accent); opacity:.9; padding-top:2px;
    text-shadow: 0 2px 0 rgba(125,95,51,.25);
  }
  .row-body{ min-width:0; }
  .row-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .row-top h3{ font-size:1.12rem; font-weight:700; line-height:1.3; color:var(--bg); }
  .tag{
    background: rgba(175,127,66,.2); color: var(--bg);
    font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:5px; white-space:nowrap;
    box-shadow: inset 0 -1px 0 rgba(125,95,51,.35);
  }
  html[dir="rtl"] .tag{ text-transform:none; letter-spacing:0; }
  .row-desc{
    color:var(--muted); font-size:.9rem; line-height:1.55; margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row-meta{ display:flex; flex-wrap:wrap; gap:7px 24px; margin-top:12px; font-size:.9rem; }
  .row-meta span{ display:inline-flex; align-items:center; gap:7px; min-width:0; }
  .row-meta svg{ color: var(--accent); }
  .row-meta .loc{ color:var(--muted); }
  .row-actions{
    display:flex; flex-direction:column; gap:9px; justify-content:center; align-items:stretch;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:9px; padding:9px 15px;
    /* Фон прозрачный ЯВНО: иначе браузер рисует свой белый #efefef,
       на котором светлый текст исчезает (баг «белой кнопки») */
    background:transparent; -webkit-appearance:none; appearance:none;
    font-size:.83rem; font-weight:700; cursor:pointer;
    text-decoration:none; border:1px solid transparent;
    transition: filter .2s, background .2s, transform .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .btn:active{ transform: translateY(2px); }
  .btn-solid{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg);
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.4);
  }
  .btn-solid:hover{ filter:brightness(1.08); }
  .btn-solid:active{ box-shadow: 0 1px 0 var(--accent-lo); }
  /* #efefef — тот же фон, что раньше подставлял браузер: тёмная тема не меняется 1:1 */
  .btn-outline{ background:#efefef; border-color:var(--accent); color:var(--bg); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
  .btn-outline:hover{ background:rgba(175,127,66,.15); }
  .btn-danger{ background:#efefef; border-color:var(--accent2); color:var(--accent2); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-danger:hover{ background:rgba(184,115,79,.14); }
  .empty{ padding:64px 24px; text-align:center; color:var(--muted); }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty h4{ color:var(--bg); font-weight:700; margin-bottom:6px; font-size:1.05rem; }
  .empty p{ font-size:.9rem; max-width:340px; margin:0 auto; line-height:1.6; }

  .detail-tag{ display:inline-block; margin-bottom:12px; }
  .detail-desc{ color:var(--muted); line-height:1.6; margin:6px 0 14px; font-size:.95rem; }
  .detail-meta{ display:flex; flex-direction:column; gap:9px; margin:14px 0 18px; font-size:.95rem; }
  .detail-meta span{ display:inline-flex; align-items:center; gap:9px; }
  .detail-meta svg{ color: var(--muted); }
  .detail-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .detail-actions .btn{ flex:1; min-width:130px; }
  .views-admin{ display:flex; align-items:center; gap:9px; margin-top:12px; padding:8px 10px;
    border:1px dashed rgba(175,127,66,.55); border-radius:10px; }
  .views-admin-l{ display:inline-flex; align-items:center; gap:7px; font-size:.83rem; font-weight:700; color:var(--muted); white-space:nowrap; }
  .views-admin-l svg{ color: var(--accent); }
  .views-admin input{ width:86px; flex:0 0 auto; background: var(--bg); color: var(--card);
    border:1px solid transparent; border-radius:8px; padding:8px 10px; font:inherit; font-size:15px;
    outline:none; box-shadow: inset 0 2px 5px rgba(0,0,0,.3); }
  .views-admin input:focus{ border-color: var(--accent); }
  .views-dec-btn{ display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:var(--accent2); border:1px solid rgba(175,127,66,.55);
    border-radius:8px; padding:8px 12px; font:inherit; font-weight:700; cursor:pointer;
    transition: background .2s, transform .18s; }
  .views-dec-btn:hover{ background: rgba(175,127,66,.12); }

  /* ============ Модалка подписки ============ */
  .plans{ display:flex; gap:10px; margin-top:6px; }
  .plan{
    flex:1; display:flex; flex-direction:column; gap:6px;
    background: #18202f;
    border:1px solid var(--accent); border-radius:12px;
    padding:16px 12px; cursor:pointer; text-align:center;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s backwards;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .plan:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px -10px rgba(0,0,0,.55);
    background: #1E2839;
  }
  .plan.on{
    background: #1E2839;
    border:2px solid var(--accent);
    box-shadow: 0 8px 22px -10px rgba(175,127,66,.55), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .plan-name{ font-size:.82rem; font-weight:700; color:#DCE1E6; }
  .plan-price{
    font-size:1.45rem; font-weight:800; color: var(--accent-hi);
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .plan-note{ font-size:.72rem; font-weight:600; color:#9BA8B6; }
  .agent-card{
    display:flex; align-items:center; gap:12px;
    margin-top:14px; padding:12px 14px;
    border:1px solid rgba(175,127,66,.35); border-radius:12px;
    background: linear-gradient(180deg, #1E2839, #18202f);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 18px -12px rgba(0,0,0,.6);
  }
  .agent-ic{
    width:40px; height:40px; border-radius:11px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background: rgba(175,127,66,.16); color: var(--accent-hi);
    border:1px solid rgba(175,127,66,.4);
  }
  .agent-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .agent-name{ font-size:.76rem; font-weight:600; color:#9BA8B6; line-height:1.45; }
  .agent-phone{
    color: var(--accent-hi); font-weight:800; font-size:.98rem;
    text-decoration:none; direction:ltr; unicode-bidi:isolate;
    display:inline-flex; align-items:center; gap:7px;
    width:fit-content; letter-spacing:.02em;
    transition: filter .2s, transform .18s, box-shadow .18s;
  }
  .agent-phone:hover{ filter:brightness(1.2); transform: translateY(-1px); }
  .sub-hint{
    margin-top:14px; font-size:.72rem; color:var(--muted);
    line-height:1.5; text-align:center;
  }

  /* ============ v1.2.3 · Мастер заявки: цена → правила → анкета → готово ============ */
  .steps{ display:flex; gap:7px; margin-bottom:9px; }
  .step{
    flex:1; height:5px; border-radius:99px;
    background:rgba(255,255,255,.09);
    transition: background .3s;
  }
  .step.on{ background: var(--accent); }
  .step.done{ background: rgba(175,127,66,.45); }
  html[data-theme="light"] .step{ background: rgba(8,58,79,.14); }
  html[data-theme="light"] .step.on{ background:#407e8c; }
  html[data-theme="light"] .step.done{ background: rgba(64,126,140,.45); }
  .steps-cap{
    font-size:.74rem; font-weight:700; color:var(--muted);
    margin-bottom:18px; letter-spacing:.04em;
  }
  .app-pane{ animation: fadeUp .3s backwards; }
  .rules-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .rule{
    display:flex; gap:11px; align-items:flex-start;
    background:#18202f; border:1px solid rgba(175,127,66,.28); border-radius:12px;
    padding:12px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .rule-num{
    width:24px; height:24px; border-radius:8px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background: rgba(175,127,66,.16); color: var(--accent-hi);
    border:1px solid rgba(175,127,66,.4);
    font-weight:800; font-size:.78rem;
  }
  .rule p{ font-size:.86rem; color:#DCE1E6; line-height:1.5; margin:0; }
  .agree{
    position:relative; display:flex; gap:11px; align-items:flex-start; cursor:pointer;
    padding:13px 14px; border:1.5px dashed rgba(175,127,66,.55); border-radius:12px;
    background: rgba(175,127,66,.06);
    transition: background .2s, border-color .2s;
    user-select:none; -webkit-user-select:none; touch-action: manipulation;
  }
  .agree:hover{ background: rgba(175,127,66,.1); }
  .agree input{ position:absolute; opacity:0; pointer-events:none; }
  .agree-box{
    width:22px; height:22px; border-radius:7px; flex-shrink:0; margin-top:1px;
    border:2px solid var(--accent); background: var(--bg); color: transparent;
    display:inline-flex; align-items:center; justify-content:center;
    transition: background .2s, color .2s;
  }
  .agree.on{ border-style:solid; border-color:var(--accent); background:rgba(175,127,66,.13); }
  .agree.on .agree-box{ background: var(--accent); color:#fff; }
  .agree-text{ font-size:.85rem; font-weight:600; line-height:1.45; color:var(--bg); }
  html[data-theme="light"] .agree{ background:rgba(64,126,140,.06); border-color:rgba(64,126,140,.5); }
  html[data-theme="light"] .agree-box{ background:#fff; }
  .done-ic{
    width:64px; height:64px; margin:8px auto 14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(175,127,66,.15); color: var(--accent-hi);
    border:1px solid rgba(175,127,66,.5);
    animation: popIn .45s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes popIn{
    from{ transform:scale(.55); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .done-title{ text-align:center; font-size:1.12rem; font-weight:800; margin-bottom:8px; color:var(--bg); }
  .done-desc{ text-align:center; }
  .done-wa{ margin-top:2px; width:100%; justify-content:center; display:inline-flex; margin-bottom:11px; }

  /* ============ v1.2.3 · Очередь заявок (стили карточек — теперь внутри админ-панели v1.3.0) ============ */
  .reqs-badge{
    min-width:21px; height:21px; padding:0 6px; border-radius:99px;
    background:#fff; color:#1d4a5c;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.74rem; font-weight:800;
  }
  .reqs-count{ font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:14px; }
  .reqs-list{ display:flex; flex-direction:column; gap:12px; }
  .req-card{
    background:#18202f; border:1px solid rgba(175,127,66,.3); border-radius:13px;
    padding:14px 15px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    animation: fadeUp .3s backwards;
  }
  .req-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .req-plan{
    font-size:.72rem; font-weight:800; color:var(--accent-hi);
    background:rgba(175,127,66,.14); border:1px solid rgba(175,127,66,.4);
    border-radius:99px; padding:3px 10px;
  }
  .req-date{ font-size:.7rem; color:#9BA8B6; margin-inline-start:auto; }
  .req-name{ font-size:.95rem; font-weight:800; color:#DCE1E6; line-height:1.35; }
  .req-meta{
    display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:7px;
    font-size:.76rem; color:#9BA8B6; font-weight:600;
  }
  .req-meta span{ display:inline-flex; align-items:center; gap:5px; min-width:0; }
  .req-desc{ margin-top:8px; font-size:.8rem; color:#DCE1E6; opacity:.85; line-height:1.5; }
  .req-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .req-actions .btn{ flex:1; min-width:104px; padding:9px 10px; font-size:.8rem; }
  @media (max-width:640px){
    .req-actions .btn{ min-width:96px; }
  }

  /* ============ Появление при скролле ============ */
  .reveal{ opacity:0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.vis{ opacity:1; transform:none; }

  /* ============ Футер: агент ============ */
  footer{
    border-top:1px solid var(--line);
    padding:26px 24px 110px; text-align:center;
    color:var(--muted); font-size:.8rem;
    line-height:1.7;
  }
  footer::before{
    content:""; position:absolute; top:-1px; left:12%; right:12%; height:1px;
    background: linear-gradient(90deg, transparent, rgba(175,127,66,.6), transparent);
  }
  .footer-agent{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .fa-line{ color:var(--card); opacity:.88; font-weight:600; font-size:.85rem; }
  .fa-addr{ font-size:.75rem; opacity:.75; max-width:620px; margin:0 auto; line-height:1.75; }
  .footer-phone{
    display:inline-flex; align-items:center; gap:7px;
    color: var(--accent); font-weight:700;
    text-decoration:none; font-size:1rem;
    direction:ltr; unicode-bidi:isolate;
    letter-spacing:.02em;
    transition: filter .2s, transform .18s, box-shadow .18s;
  }
  .footer-phone:hover{ filter: brightness(1.25); text-decoration:underline; transform: translateY(-1px); }
  .footer-phone svg{ color: var(--accent); }
  .footer-note{ margin-top:16px; font-size:.72rem; opacity:.7; }

  /* ============ v1.3.0 · Плавающая кнопка «Админ-панель» ============
     Заменяет стек из 4 кнопок (экспорт/заявки/напоминания/выход):
     теперь всё внутри организованной панели с вкладками */
  .float-panel{
    position:fixed; bottom:34px; left:50%; transform:translateX(-50%);
    z-index:60; display:none;
    align-items:center; gap:9px;
    background: linear-gradient(180deg, #4E8FA8, #376E85);
    color:#fff;
    border:none; border-radius:999px;
    padding:13px 22px; font-weight:700; font-size:.9rem; cursor:pointer;
    box-shadow: 0 4px 0 #27566B, 0 16px 34px -6px rgba(0,0,0,.55);
    transition: filter .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
    max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .float-panel:hover{ filter:brightness(1.1); }
  .float-panel:active{ transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #27566B; }
  .float-panel.show{ display:inline-flex; animation: fadeUp .35s backwards; }
  .float-panel svg{ flex:none; color:#fff; }
  html[data-theme="light"] .float-panel{
    background: linear-gradient(180deg,#4f93a3,#407e8c);
    box-shadow: 0 4px 0 #2e5f6d, 0 16px 34px -6px rgba(8,58,79,.45);
  }

  /* ============ v1.3.0 · Админ-панель: статистика + вкладки ============ */
  .adm-modal{ max-width:660px; }
  .adm-stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:4px 0 12px;
  }
  .stat-card{
    background:#18202f; border:1px solid rgba(175,127,66,.28); border-radius:12px;
    padding:12px 6px 10px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    animation: fadeUp .3s backwards;
  }
  html[data-theme="light"] .stat-card{ background:#F4EFE7; border-color:rgba(175,127,66,.4); }
  .stat-num{ font-size:1.4rem; font-weight:800; color:var(--accent-hi); line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat-num.hot{ color:#E8B15C; }
  .stat-lbl{ font-size:.64rem; color:#9BA8B6; font-weight:700; line-height:1.25; }
  html[data-theme="light"] .stat-lbl{ color:#6b6156; }
  .adm-tabs{ display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:4px; scrollbar-width:none; }
  .adm-tabs::-webkit-scrollbar{ display:none; }
  .adm-tab{
    position:relative; display:inline-flex; align-items:center; gap:7px;
    background:#18202f; border:1px solid var(--line); color:#9BA8B6;
    border-radius:999px; padding:9px 14px;
    font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap;
    transition: color .18s, border-color .18s, background .18s;
    font-family:inherit;
  }
  html[data-theme="light"] .adm-tab{ background:#F4EFE7; }
  .adm-tab:hover{ color:var(--accent-hi); }
  .adm-tab.on{ color:var(--accent-hi); border-color:rgba(175,127,66,.65); background:rgba(175,127,66,.12); }
  .adm-badge{
    min-width:19px; height:19px; padding:0 5px; border-radius:99px;
    background:var(--accent); color:#22180C;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:800;
  }
  .adm-pane{ max-height:58vh; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:12px; padding:2px; }
  .adm-view{ display:flex; flex-direction:column; gap:12px; }
  .adm-search{
    display:flex; align-items:center; gap:9px;
    background:#18202f; border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; color:#9BA8B6;
  }
  html[data-theme="light"] .adm-search{ background:#F4EFE7; }
  .adm-search input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--card); font:inherit; font-size:.9rem;
  }
  .adm-doc{
    background:#18202f; border:1px solid rgba(175,127,66,.25); border-radius:13px;
    padding:12px 13px;
    animation: fadeUp .3s backwards;
  }
  html[data-theme="light"] .adm-doc{ background:#F4EFE7; }
  .adm-doc-top{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }
  .adm-doc-name{ font-size:.93rem; font-weight:800; color:#DCE1E6; line-height:1.35; word-break:break-word; }
  html[data-theme="light"] .adm-doc-name{ color:#3A322A; }
  .ttl-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.68rem; font-weight:800; border-radius:99px; padding:3px 9px;
    margin-inline-start:auto;
  }
  .ttl-ok{ color:#7FC98F; background:rgba(85,149,95,.14); border:1px solid rgba(85,149,95,.45); }
  .ttl-warn{ color:#E8B15C; background:rgba(201,154,75,.15); border:1px solid rgba(201,154,75,.45); }
  .ttl-dead{ color:#E07A6C; background:rgba(224,122,108,.13); border:1px solid rgba(224,122,108,.45); }
  .adm-doc-actions{ display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; }
  .adm-doc-actions .btn{ flex:none; padding:7px 11px; font-size:.75rem; }
  .btn-renew{ color:#7FC98F; border-color:rgba(85,149,95,.5); }
  .btn-renew:hover{ background:rgba(85,149,95,.12); }
  .tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .tool-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:7px;
    background:#18202f; border:1px solid var(--line); border-radius:13px;
    padding:14px; cursor:pointer; color:var(--card); text-align:start;
    font-family:inherit; transition: border-color .18s, filter .18s;
  }
  .tool-btn:hover{ border-color:rgba(175,127,66,.55); filter:brightness(1.06); }
  .tool-btn:active{ transform:scale(.98); }
  .tool-btn svg{ color:var(--accent-hi); }
  .tool-btn .tt{ font-weight:800; font-size:.84rem; line-height:1.3; }
  .tool-btn .td{ font-size:.7rem; color:#9BA8B6; line-height:1.4; }
  html[data-theme="light"] .tool-btn{ background:#F4EFE7; }
  html[data-theme="light"] .tool-btn .td{ color:#6b6156; }
  .tool-btn.danger .tt{ color:#E07A6C; }

  /* ============ v1.3.0 · Избранное и сортировка в списке ============ */
  .list-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 0 2px; }
  .chip-fav svg{ color:#E0645C; }
  .chip-fav.fav-on{ color:#E0645C; border-color:rgba(224,100,92,.55); background:rgba(224,100,92,.1); }
  .sort-sep{ width:1px; height:18px; background:var(--line); }
  .btn-sq{ padding:9px 11px; }
  .row-fav, .detail-fav{ color:var(--muted); }
  .row-fav.fav-on, .detail-fav.fav-on{ color:#E0645C; border-color:rgba(224,100,92,.55); }
  .row-fav.fav-on svg path, .detail-fav.fav-on svg path{ fill:currentColor; }

  /* ============ v1.3.0 · Жалоба на анкету ============ */
  .rep-reasons{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .rep-reason.on{ color:var(--accent-hi); border-color:rgba(175,127,66,.65); background:rgba(175,127,66,.12); }

  /* ============ v1.2.7 · Напоминания (пилюля дней — внутри панели) ============ */
  .rem-warn{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.72rem; font-weight:800; color:#E8B15C;
    background:rgba(201,154,75,.15); border:1px solid rgba(201,154,75,.45);
    border-radius:99px; padding:3px 10px;
  }
  html[data-theme="light"] .rem-warn{ color:#8a6630; }

  .float-sub{
    position:fixed; bottom:26px; inset-inline-end:26px;
    z-index:60;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none; border-radius:999px;
    padding:15px 22px; font-weight:800; font-size:.92rem; cursor:pointer;
    box-shadow: 0 4px 0 var(--accent-lo), 0 14px 30px -6px rgba(0,0,0,.55);
    transition: filter .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
    animation: subFloat 3.5s ease-in-out infinite;
  }
  .float-sub:hover{ filter: brightness(1.1); }
  .float-sub:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-lo); animation-play-state:paused; }
  .float-sub svg{ color: var(--bg); }
  @keyframes subFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  /* ============ Тосты ============ */
  #toastWrap{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    z-index:10050;
    display:flex; flex-direction:column; gap:9px; align-items:center;
    pointer-events:none; width:min(92vw, 480px);
  }
  .toast{
    background:var(--card); color:var(--bg);
    border-inline-start:4px solid var(--accent);
    border-radius:10px; padding:13px 20px;
    font-size:.9rem; font-weight:600;
    box-shadow: 0 18px 40px -10px rgba(0,0,0,.5);
    animation: fadeUp .3s backwards; max-width:100%;
    word-break: break-word;
  }
  .toast.err{ border-inline-start-color: var(--accent2); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }

  /* ============ Модальные окна ============ */
  .overlay{
    position:fixed; inset:0;
    z-index:9999;
    background:rgba(24,32,47,.55);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; opacity:0; pointer-events:none;
    transition: opacity .28s;
    touch-action: manipulation;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--card); color:var(--bg);
    width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
    border-radius:16px; padding:30px 28px;
    transform: translateY(16px) scale(.96) rotateX(2deg);
    transition: transform .28s;
    box-shadow: 0 50px 110px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.6);
    touch-action: manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show .modal{ transform:none; }
  .modal-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; padding-bottom:11px; border-bottom:1px solid var(--line-soft); }
  .modal-head h3{ font-size:1.3rem; font-weight:800; flex:1; line-height:1.25; color:var(--bg); }
  .modal-close{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:9px; border-radius:9px; display:flex; flex-shrink:0;
    touch-action: manipulation;
    transition: background .2s, color .2s, transform .25s;
  }
  .modal-close:hover{ color:var(--accent2); background:rgba(104,116,138,.15); }
  .modal-close:active{ transform: scale(.92); }
  .modal-back{
    background:rgba(175,127,66,.14); color:var(--bg);
    border:1px solid var(--accent); border-radius:9px;
    padding:7px 14px 7px 10px; font-weight:700; font-size:.8rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    margin-bottom:14px;
    touch-action: manipulation;
    transition: background .2s, transform .15s;
  }
  .modal-back:hover{ background:rgba(175,127,66,.24); }
  .modal-back:active{ transform: scale(.96); }
  html[dir="rtl"] .modal-back{ padding:7px 10px 7px 14px; }
  .modal-desc{ color:var(--muted); font-size:.9rem; line-height:1.55; margin-bottom:22px; }

  .field{ margin-bottom:17px; }
  .field label{
    display:block; font-size:.72rem; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px;
  }
  html[dir="rtl"] .field label{ text-transform:none; }
  .field label .req{ color: var(--accent2); }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--bg); color: var(--card);
    border:1px solid transparent; border-radius:10px;
    padding:12px 14px; font:inherit; font-size:16px;
    outline:none; transition: border-color .2s, box-shadow .2s;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.3);
    touch-action: manipulation;
  }
  .field textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.3), 0 0 0 3px rgba(175,127,66,.18);
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--muted); }
  .field select{ appearance:none; cursor:pointer; }
  .counter{ text-align:end; font-size:.72rem; color:var(--muted); margin-top:5px; }
  .counter.over{ color:var(--accent2); font-weight:700; }

  /* ============ Маршруты (перевозки): выбор пункта Б тапом ============ */
  .route-pick{ display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  /* фон модалки светлый — базовый .chip (светлый текст) здесь невидим */
  .route-pick .chip{ padding:5px 12px; font-size:.78rem; color:var(--muted); }
  .route-pick .chip:hover{ color:var(--accent); }
  .route-pick .chip.on{ color:var(--accent); }
  /* Фильтр направлений в списке */
  .dest-filter{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0 2px; }
  .dest-label{ font-size:.8rem; color:var(--muted); font-weight:700; }
  .modal-actions{ display:flex; gap:11px; margin-top:24px; }
  .modal-actions .btn{ flex:1; padding:13px; font-size:.92rem; }

  .modal-submit{
    width:100%; margin-top:4px; padding:15px; font-size:1rem !important;
    touch-action: manipulation;
    min-height:52px;
  }
  .modal-submit:active{ transform: scale(.98); filter:brightness(1.15); }
  .modal-submit[disabled]{ opacity:.55; pointer-events:none; }

  .err-banner{
    display:none;
    background: var(--accent2); color: var(--card);
    border-radius:10px; padding:12px 16px;
    font-size:.88rem; font-weight:700;
    margin-bottom:18px; text-align:center;
    word-break: break-word;
    box-shadow: 0 6px 16px -6px rgba(184,115,79,.6);
  }
  .err-banner.show{ display:block; animation: fadeUp .3s backwards; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============ Полировка v15 ============ */
  ::selection{ background:rgba(175,127,66,.45); color:#fff; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  *{ scrollbar-width:thin; scrollbar-color:rgba(175,127,66,.45) transparent; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo)); border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .cat-pill .cnt{ background:rgba(104,116,138,.18); border-radius:99px; padding:2px 8px; }
  .cat-pill.on .cnt{ background:rgba(24,32,47,.22); }
  .cat-pill .cic{ display:inline-flex; color:var(--accent); }
  .cat-pill.on .cic{ color:var(--bg); }
  .cic svg{ display:block; }

  .num{
    background:linear-gradient(180deg,var(--accent-hi) 15%,var(--accent-lo) 90%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:none;
  }

  @keyframes floatSoft{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .empty svg{ animation:floatSoft 4.5s ease-in-out infinite; }

  .btn-solid{ position:relative; overflow:hidden; }
  .btn-solid::after{
    content:""; position:absolute; top:0; bottom:0; width:36%;
    inset-inline-start:-50%; transform:skewX(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transition:inset-inline-start .6s ease;
    pointer-events:none;
  }
  .btn-solid:hover::after{ inset-inline-start:120%; }

  html[lang="ku"] .hero-alt{ font-family:'Golos Text','Noto Sans',sans-serif; }
  .toast{ border-top:1px solid rgba(175,127,66,.25); }
  .sheet{ border:1px solid rgba(175,127,66,.14); }
  .modal{ border:1px solid rgba(175,127,66,.2); }

  /* ============ Шестерёнка (настройки) ============ */
  .btn-gear{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    background:none; border:1px solid var(--line); color:var(--card);
    border-radius:9px; cursor:pointer; flex-shrink:0;
    transition: border-color .2s, color .2s, background .2s;
    touch-action: manipulation;
  }
  .btn-gear:hover{ border-color:var(--accent); color:var(--accent); background:rgba(175,127,66,.1); }
  .btn-gear:active{ transform:scale(.94); }
  .btn-gear svg{ transition: transform .5s ease; }
  .btn-gear:hover svg{ transform: rotate(60deg); }
  .set-block{ margin-bottom:20px; }
  .set-label{
    display:flex; align-items:center; gap:8px;
    font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:9px;
  }
  html[dir="rtl"] .set-label{ text-transform:none; letter-spacing:0; }
  .set-label svg{ color:var(--accent); }
  .theme-seg{ display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  .theme-seg button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:none; border:none; color:var(--muted);
    font:inherit; font-weight:700; font-size:.86rem;
    padding:12px 8px; cursor:pointer;
    transition: background .2s, color .2s;
    touch-action: manipulation;
  }
  .theme-seg button:hover{ color:var(--accent); }
  .theme-seg button.on{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg);
  }
  .theme-seg button.on:hover{ color:var(--bg); }
  .set-langs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .set-langs button{
    background:none; border:1px solid var(--line); color:var(--bg);
    border-radius:10px; padding:11px 8px;
    font:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: border-color .2s, background .2s, color .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .set-langs button:hover{ border-color:var(--accent); }
  .set-langs button:active{ transform:scale(.96); }
  .set-langs button.on{
    border-color:var(--accent); color:var(--accent);
    background:rgba(175,127,66,.13); font-weight:700;
  }

  /* ============ Светлая тема (Настройки → Тема) ============
     Палитра: фон #e5e1dd, бирюза #407e8c, бронза #a58d66, тёмно-синий #083a4f.
     Токены инвертируются: --bg = светлая страница, --card = тёмные поверхности
     и цвет текста на странице (как в тёмной теме, но наоборот). */
  html[data-theme="light"]{
    --bg:#e5e1dd;
    --card:#083a4f;
    --muted:#748b97;
    --accent:#407e8c;
    --accent2:#a58d66;
    --accent-hi:#4f93a3;
    --accent-lo:#2e5a66;
    --line:rgba(8,58,79,.28);
    --line-soft:rgba(8,58,79,.14);
  }
  html[data-theme="light"] .topbar{ background:rgba(229,225,221,.94); }
  html[data-theme="light"] .search{ background:rgba(8,58,79,.05); box-shadow:none; }
  html[data-theme="light"] .search:focus-within{ box-shadow:0 0 0 3px rgba(64,126,140,.2); }
  html[data-theme="light"] .city-card, html[data-theme="light"] .level-card{ background:rgba(8,58,79,.045); }
  html[data-theme="light"] .city-card:hover, html[data-theme="light"] .level-card:hover{ background:rgba(64,126,140,.09); }
  html[data-theme="light"] .chip.on{ background:rgba(64,126,140,.12); box-shadow:0 3px 10px -4px rgba(64,126,140,.4); }
  /* Контурные кнопки (WhatsApp / Копировать / Изменить / Удалить / Отмена):
   БЕЛЫЙ ПОД ЗАПРЕТОМ — призрачная бирюза из палитры, текст видно без наведения */
  html[data-theme="light"] .btn-outline{
    background:rgba(64,126,140,.26); color:#e5e1dd;
    border-color:#4f93a3; box-shadow:none;
  }
  html[data-theme="light"] .btn-outline:hover{ background:rgba(64,126,140,.44); }
  html[data-theme="light"] .btn-danger{
    background:rgba(165,141,102,.2); color:#e3cfa4;
    border-color:#b99f74; box-shadow:none;
  }
  html[data-theme="light"] .btn-danger:hover{ background:rgba(165,141,102,.36); }
  html[data-theme="light"] .plan, html[data-theme="light"] .plan:hover{ background:rgba(229,225,221,.08); box-shadow:0 6px 16px -8px rgba(8,58,79,.5); }
  html[data-theme="light"] .plan.on{ background:rgba(64,126,140,.24); border-color:#4f93a3; box-shadow:0 8px 22px -10px rgba(8,58,79,.55); }
  html[data-theme="light"] .plan-name{ color:#e5e1dd; }
  html[data-theme="light"] .plan-note{ color:rgba(229,225,221,.55); }
  html[data-theme="light"] .agent-card{ background:rgba(8,58,79,.06); box-shadow:none; }
  html[data-theme="light"] .agent-name{ color:#4c626e; }
  html[data-theme="light"] .agent-ic{ color:#2e6472; }
  html[data-theme="light"] .sheet{ box-shadow:0 30px 70px -25px rgba(8,58,79,.4), inset 0 1px 0 rgba(229,225,221,.14); }
  html[data-theme="light"] .modal{ box-shadow:0 50px 110px -20px rgba(8,58,79,.5), inset 0 1px 0 rgba(229,225,221,.14); }
  html[data-theme="light"] .toast{ box-shadow:0 18px 40px -10px rgba(8,58,79,.35); }
  html[data-theme="light"] .row:hover{ box-shadow:0 22px 40px -18px rgba(8,58,79,.4), 0 0 0 1px rgba(64,126,140,.3); }
  html[data-theme="light"] .brand{ text-shadow:none; }
  html[data-theme="light"] .brand svg{ filter:none; }
  html[data-theme="light"] .hero h1, html[data-theme="light"] .hero h1 em,
  html[data-theme="light"] .cities-head h2, html[data-theme="light"] .list-head h2{ text-shadow:none; }
  html[data-theme="light"] .overlay{ background:rgba(8,58,79,.4); }
  html[data-theme="light"] ::selection{ background:rgba(64,126,140,.35); color:#083a4f; }
  html[data-theme="light"] ::-webkit-scrollbar-thumb{ background:rgba(64,126,140,.45); }
  /* Месяц → солнце: ТОЛЬКО тёплый диск и мягкое «дышащее» глоу, БЕЗ лучей;
     ночные искры гаснут */
  html[data-theme="light"] .moon{
    -webkit-mask:none; mask:none;
    background:none; filter:none;
    animation:none;
  }
  html[data-theme="light"] .moon::before{
    content:""; position:absolute; inset:12%; border-radius:50%;
    background: radial-gradient(circle at 38% 32%, #fdf3cf, #f0d9a4 42%, #d9b878 74%, #b8945e 96%);
    box-shadow:
      0 0 34px 8px rgba(238,205,140,.75),
      0 0 90px 30px rgba(216,180,116,.45),
      0 0 170px 70px rgba(190,157,102,.25);
    animation: sunGlow 7s ease-in-out infinite;
  }
  @keyframes sunGlow{
    0%,100%{
      box-shadow:
        0 0 34px 8px rgba(238,205,140,.75),
        0 0 90px 30px rgba(216,180,116,.45),
        0 0 170px 70px rgba(190,157,102,.25);
    }
    50%{
      box-shadow:
        0 0 46px 13px rgba(240,209,145,.9),
        0 0 115px 40px rgba(216,180,116,.55),
        0 0 205px 88px rgba(190,157,102,.32);
    }
  }
  html[data-theme="light"] .tw, html[data-theme="light"] .shoot{ display:none; }
  html[data-theme="light"] .spark{ background:#407e8c; box-shadow:0 0 10px 2px rgba(64,126,140,.4); }
  html[data-theme="light"] .ring{ border-color:rgba(64,126,140,.22); }
  html[data-theme="light"] .r2{ border-color:rgba(64,126,140,.14); }

  /* ============ Мобильная версия ============ */
  @media (max-width: 760px){
    .moon-wrap{ display:none; }
    .btn-gear{ width:34px; height:34px; }
    .set-langs{ grid-template-columns:repeat(2,1fr); }
    .r3{ width:180px; height:180px; top:-90px; inset-inline-end:-60px; }
    .shoot{ top:24%; left:76%; width:80px; }
    .shoot2{ top:14%; left:88%; width:60px; }

    body{ font-size:15px; }
    .topbar{ height:56px; padding:0 10px; gap:7px; }
    .brand{ font-size:.8rem; letter-spacing:.04em; gap:6px; }
    .brand svg{ width:20px; height:20px; }
    .brand-sub{ display:none; }
    .topbar .btn-sub{ display:none; }
    .btn-admin{ padding:7px 9px; margin-inline-start:0; }
    .btn-admin .t{ display:none; }

    .hero{ padding:34px 14px 18px; }
    .hero h1{ font-size: clamp(1.55rem, 7.5vw, 2.1rem); gap:6px; }
    .hero-alt{ font-size:.9rem; }
    .hero-desc{ font-size:.9rem; margin-top:12px; }
    .search{ padding:10px 12px; font-size:.9rem; }

    .cube-stage{ width:32px; height:32px; }
    .cube{ width:32px; height:32px; }
    .cube .f1{ transform: translateZ(16px); }
    .cube .f2{ transform: rotateY(180deg) translateZ(16px); }
    .cube .f3{ transform: rotateY(90deg)  translateZ(16px); }
    .cube .f4{ transform: rotateY(-90deg) translateZ(16px); }
    .cube .f5{ transform: rotateX(90deg)  translateZ(16px); }
    .cube .f6{ transform: rotateX(-90deg) translateZ(16px); }

    .cats{ padding:0 14px; gap:7px; }
    .cat-pill{ padding:7px 12px; font-size:.8rem; }
    .cat-pill .cnt{ font-size:.66rem; }

    .subs{ padding:0 14px; }
    .cities{ padding:0 14px; margin-top:22px; }
    .cities-head h2{ font-size:1.12rem; }
    .cities-sub{ font-size:.78rem; }
    .city-grid{ grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap:7px; }
    .city-card{ padding:9px 11px; border-radius:10px; }
    .city-card .cc-name{ font-size:.8rem; }
    .chip{ padding:5px 11px; font-size:.74rem; }
    .level-cards{ grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap:7px; }
    .level-card{ padding:9px 10px; }
    .level-card .lc-title{ font-size:.8rem; }
    .subjects-block{ margin-top:12px; padding-top:10px; gap:6px; }

    .list-wrap{ margin:26px auto 130px; padding:0 14px; }
    .list-head h2{ font-size:1.15rem; }
    .row{ grid-template-columns: minmax(0,1fr); gap:12px; padding:18px 14px; }
    .row:hover{ transform: translateY(-2px); }
    .num{ display:none; }
    .row-top h3{ font-size:1rem; }
    .tag{ font-size:.62rem; max-width:100%; white-space:normal; }
    .row-desc{ font-size:.84rem; }
    .row-meta{ font-size:.84rem; gap:5px 16px; }
    .row-actions{ flex-direction:row; flex-wrap:wrap; }
    .row-actions .btn{ flex:1; min-width:100px; padding:8px 10px; font-size:.76rem; }
    .btn-add{ margin-inline-start:0; width:100%; justify-content:center; }

    .conn{ margin-inline-start:0; width:100%; }
    .float-panel{ font-size:.8rem; padding:11px 18px; bottom:88px; } /* одна кнопка вместо стека из 4 (v1.3.0) */
    .float-sub{ bottom:22px; inset-inline-end:16px; padding:16px 20px; font-size:.9rem; }

    .modal{ padding:22px 18px; max-height:92vh; }
    .modal-head h3{ font-size:1.1rem; }
    .overlay{ padding:12px; align-items:center; }
    .plans{ flex-direction:column; }
  }

  /* ============ v1.2.2 · МОБИЛЬНАЯ ИНТЕРАКТИВНОСТЬ + ВЕРСИЯ ============ */
  /* 1) Никаких серых вспышек при тапе (Android/Chrome) */
  html{ -webkit-tap-highlight-color: transparent; }
  /* 2) Быстрые тапы без задержки двойного нажатия */
  button, a, .city-card, .cat-pill, .level-card, .chip, .row, .plan{ touch-action: manipulation; }
  /* 3) Тап-отклик вместо hover — элемент «вдавливается» под пальцем */
  button:active{ transform: scale(.96); filter: brightness(.9); }
  .city-card:active, .level-card:active{ transform: scale(.98); }
  .cat-pill:active, .chip:active, .set-langs button:active, .theme-seg button:active{ transform: scale(.94); }
  .row:active{ transform: scale(.99); background: rgba(175,127,66,.08); }
  html[data-theme="light"] .row:active{ background: rgba(64,126,140,.08); }
  .plan:active{ transform: scale(.98); }
  .float-panel:active, .float-sub:active{ transform: scale(.92); }
  .btn-gear:active{ transform: rotate(30deg) scale(.9); }
  .modal-close:active, .modal-back:active{ transform: scale(.88); }
  /* 4) iOS: поля 16px на телефонах — экран не зумится при фокусе */
  @media (max-width:760px){
    input, select, textarea{ font-size:16px !important; }
  }
  /* 5) Бейдж версии в футере — по нему ориентируемся в чате */
  .ver-line{ margin-top:14px; display:flex; justify-content:center; }
  .ver-badge{
    font-size:.72rem; font-weight:600; letter-spacing:.12em;
    color:var(--muted);
    border:1px solid var(--line); border-radius:999px;
    padding:3px 12px; opacity:.85;
    font-variant-numeric: tabular-nums;
  }

  /* ============ v1.2.2 · ПК-ИНТЕРАКТИВНОСТЬ 100% ============ */
  /* 1) Ripple: волна расходится ОТ ТОЧКИ нажатия — мышью на ПК и пальцем на телефоне.
     Хосту класс .rip-host добавляет JS (делегирование pointerdown), span.rip удаляется сам */
  .rip-host{ position:relative; overflow:hidden; }
  /* ⚠️ ХОТФИКС v1.2.4: .rip-host (position:relative) перебивал position:fixed у
     плавающих кнопок — после первого нажатия кнопка выпадала из fixed-слоя
     в конец <body> и исчезала с экрана до перезагрузки (Ctrl+Shift+R).
     fixed сам является контейнером для span.rip — просто возвращаем fixed
     (специфичность 0-2-0 бьёт 0-1-0 у .rip-host) */
  .float-sub.rip-host, .float-panel.rip-host{ position:fixed; } /* FIX v1.2.4: ripple не должен ломать fixed */
  .rip{
    position:absolute; border-radius:50%;
    background:rgba(175,127,66,.3);
    transform:scale(0); opacity:.85; pointer-events:none;
    animation:ripGo .55s ease-out forwards;
  }
  .rip.on-solid{ background:rgba(255,255,255,.45); }
  html[data-theme="light"] .rip{ background:rgba(64,126,140,.3); }
  html[data-theme="light"] .rip.on-solid{ background:rgba(255,255,255,.5); }
  @keyframes ripGo{ to{ transform:scale(1); opacity:0; } }
  /* 2) fadeUp теперь backwards (а не both): раньше fill both держал transform навсегда —
     hover-подъём карточек/строк/планов на ПК не работал, float-кнопки теряли сдвиг,
     тосты исчезали без анимации. Теперь после входа элемент снова слушается hover/:active */
  /* 3) Усиленный hover — только устройства с настоящим курсором (ПК, ноутбук, мышь);
     на телефоне остаётся тап-отклик :active из блока выше — дублировать не нужно */
  @media (hover:hover) and (pointer:fine){
    .btn-sub:hover, .btn-add:hover{
      transform:translateY(-2px);
      box-shadow:0 5px 0 var(--accent-lo), 0 16px 28px -8px rgba(0,0,0,.55);
    }
    .btn-solid:hover{
      transform:translateY(-2px);
      box-shadow:0 5px 0 var(--accent-lo), 0 16px 28px -8px rgba(0,0,0,.5);
    }
    .btn-outline:hover, .btn-danger:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 20px -12px rgba(0,0,0,.55);
    }
    .btn-admin:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 18px -10px rgba(175,127,66,.5);
    }
    .cat-pill:hover{
      transform:translateY(-2px);
      background:rgba(175,127,66,.09);
      box-shadow:0 10px 20px -12px rgba(0,0,0,.55);
    }
    .cat-pill.on:hover{
      background:linear-gradient(180deg, var(--accent-hi), var(--accent));
      box-shadow:0 5px 0 var(--accent-lo), 0 14px 26px -8px rgba(175,127,66,.5);
    }
    .chip:hover{
      color:var(--accent); background:rgba(175,127,66,.08);
      transform:translateY(-1px);
      box-shadow:0 8px 16px -10px rgba(0,0,0,.5);
    }
    .chip.on:hover{ background:rgba(175,127,66,.16); }
    .city-card:hover .cc-cnt{ opacity:1; }
    .views-dec-btn:hover{ transform:translateY(-1px); }
    .set-langs button:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 16px -10px rgba(0,0,0,.5);
    }
    .float-panel:hover{
      transform:translateX(-50%) translateY(-3px);
      box-shadow:0 7px 0 #27566B, 0 22px 44px -8px rgba(0,0,0,.6);
    }
    .float-sub:hover{
      filter:brightness(1.12);
      box-shadow:0 7px 0 var(--accent-lo), 0 22px 46px -8px rgba(0,0,0,.65);
    }
    .modal-close:hover{ transform:rotate(90deg); }
    .modal-back:hover{ transform:translateY(-1px); }
  }

  /* ============ v1.2.2 · ЭКОНОМИЯ НА ТЕЛЕФОНАХ (по референсу webcart) ============
     Референс на (pointer:coarse) отключает #cursorGlow — тяжёлая декорация не для тача.
     Композитные трансформы (луна, кольца, искры) остаются — они дешёвые;
     отключаем то, что реально греет телефон и роняет FPS: */
  @media (pointer:coarse){
    .cube{ animation-duration:42s; }            /* 3D-куб почти статичен — в 3 раза дешевле */
    .shoot, .shoot2{ animation:none; opacity:0; } /* падающие звёзды — прочь (88% жизни невидимы) */
    .float-sub{ animation:none; }                 /* главный CTA не подпрыгивает — меньше перерисовок */
  }
  /* Уважение к системной настройке «меньше движения» — как у референса */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    html{ scroll-behavior:auto; }
  }
</style>
</head>

  const RIP_SEL = ".btn, .btn-sub, .btn-add, .btn-admin, .cat-pill, .chip, " +
    ".city-card, .level-card, .plan, .float-sub, .float-panel, .adm-tab, .tool-btn, .modal-back";

  document.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return; // левая кнопка / тач / перо — правый клик молчит

    if (!host || !host.isConnected) return;

    const r = host.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 1.7 + 6;
    const sp = document.createElement("span");

  function filtered() {
    let items = state.docs.filter(d => d.group === state.level && inCity(d) && !isExpired(d));
    if (state.sub !== "all") items = items.filter(d => d.subcategory === state.sub);
    if (state.dest && state.dest !== "all") items = items.filter(d => Array.isArray(d.routes) && d.routes.includes(state.dest));
    /* v1.3.0: чип «Избранное» — только отмеченные сердечком анкеты */
    if (state.favOnly) items = items.filter(d => favSet.has(d.id));
    if (state.search) {
      const q = state.search.toLowerCase();
      const qs = q.replace(/\s/g, "");
      const hits = citiesInQuery(state.search);
      const textMatch = (d) =>
        (d.title || "").toLowerCase().includes(q) ||
        (d.description || "").toLowerCase().includes(q) ||
        (d.phone || "").replace(/\s/g, "").includes(qs) ||
        (d.carMake || "").toLowerCase().includes(q) ||
        namesHit(d, q);
      const pairMode = hits.length >= 2; /* «Ракка - Алеппо»: явное направление */
      items = items.filter(d => {
        /* Перевозки — СТРОГО по направлению: пункт А = город анкеты,
           пункт Б = добавленные направления. Поиск «Ракка - Алеппо»
           показывает только анкеты с городом Ракка и пунктом Б Алеппо */
        if (d.subcategory === "transport" && hits.length) {
          const routes = Array.isArray(d.routes) ? d.routes : [];
          const from = docCityId(d);
          if (hits.length === 1) {
            const g = hits[0];
            return g === from || routes.includes(g);
          }
          /* 2+ города: направление по порядку упоминания:
             «Ракка - Алеппо» = из Ракки в Алеппо:
             пункт А анкеты = первый город, пункт Б = второй */
          for (let i = 0; i < hits.length; i++)
            for (let j = i + 1; j < hits.length; j++)
              if (hits[i] === from && routes.includes(hits[j])) return true;
          return false;
        }
        /* При явном направлении «откуда - куда» посторонние анкеты не показываются */
        return !pairMode && textMatch(d);
      });
    }
    /* Сортировка анкет перевозок по пункту А (городу анкеты):
       анкеты группируются по городам отправления */
    if (state.sub === "transport" && state.sort === "new")
      items.sort((a, b) =>
        CITIES.findIndex(c => c.id === docCityId(a)) - CITIES.findIndex(c => c.id === docCityId(b)));
    /* v1.3.0: сортировка посетителя — «По имени» / «Популярные»
       (выбор сохраняется в dalil_sort; для перевозок перекрывает группировку) */
    if (state.sort === "name")
      items.sort((a, b) => pname(a).localeCompare(pname(b), state.lang || "ar"));
    if (state.sort === "views")
      items.sort((a, b) => (Number(b.views) || 0) - (Number(a.views) || 0));
    return items;
  }

  /* ================= Счётчик просмотров анкеты ================= */
  /* +1 при каждом открытии карточки, а также при кликах «Позвонить»,
     «WhatsApp» (написать) и «Копировать» (номер). Число на экране растёт сразу
     (оптимистично), запись в Firestore идёт в фоне; сбой (старые правила,
     оффлайн) тихо игнорируется — посетителю ошибок не показываем */
  function fmtViews(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (Math.round(n / 100) / 10).toString().replace(/\.0$/, "") + "K";
    return String(n);
  }

  function paintViews(id, v) {
    const badges = document.querySelectorAll(`[data-views-badge="${id}"]`);
    if (badges.length) badges.forEach(el => el.textContent = fmtViews(v));
    else renderList();
  }

  function countView(id) {
    const it = state.docs.find(d => d.id === id);
    if (it) {
      it.views = (it.views || 0) + 1;
      paintViews(it.id, it.views);
    }
    updateDoc(doc(db, "providers", id), { views: increment(1) })
      .catch(() => {});
  }

  /* Админ: скрутить просмотры на N (ввёл 15 — уберётся 15, ниже нуля не упадёт) */
  function decViews(p, scope) {
    const inp = scope.querySelector(".views-dec-input");
    const n = Math.floor(Number(inp ? inp.value : 0));
    if (!n || n < 1) return;
    const nv = Math.max(0, (p.views || 0) - n);
    p.views = nv;
    paintViews(p.id, nv);
    inp.value = "";
    toast(t("viewsSet"));
    dbUpdate(p.id, { views: nv })
      .catch(err => toast(writeErrText(err), "err", 7000));
  }

  async function copyPhoneText(phone) {
    let ok = false;
    try { await navigator.clipboard.writeText(phone || ""); ok = true; }
    catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = phone || "";
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ok = document.execCommand("copy");
        ta.remove();
      } catch (e2) { ok = false; }
    }
    toast(ok ? t("copied") : (phone || ""));
  }

  /* ================= v1.3.0 · Поделиться карточкой =================
     Web Share API (телефон — системное меню), на десктопе — фолбэк:
     текст карточки копируется в буфер, посетителю тост. */
  function shareProvider(p) {
    const txt =

      (p.phone ? `\n${p.phone}` : "") +
      (p.location ? `\n${p.location}` : "") +
      `\n${location.origin + location.pathname}`;
    if (navigator.share) {

      copyPhoneText(txt);

  /* ================= v1.3.0 · Скачать контакт (vCard .vcf) =================
     Один клик — номер сохраняется в телефонную книгу: имя как в анкете,
     телефон, категория и город в NOTE. Файл генерируется на клиенте. */
  function downloadVcf(p) {
    const tel = (p.phone || "").replace(/[^\d+]/g, "");
    if (!tel) return;
    const name = pname(p) || "DALIL SURIYA";
    const note = `DALIL SURIYA — ${subName(p.group, p.subcategory)}, ${cityName(docCityId(p))}`;
    const vcf =
      "BEGIN:VCARD\r\nVERSION:3.0\r\n" +
      `FN:${name}\r\n` +
      `TEL;TYPE=CELL:${tel}\r\n` +
      `NOTE:${note}\r\n` +
      "END:VCARD\r\n";
    const fname = name.replace(/[\\/:*?"<>|\n\r]+/g, " ").trim().slice(0, 60) || "contact";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard;charset=utf-8" }));
    a.download = fname + ".vcf";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast(t("vcfOk"));
  }

  /* ================= v1.2.3 · Мастер заявки: цена → правила → анкета =================
     Публичная форма: после личной оплаты человек сам подаёт заявку.
     Заявка уходит в коллекцию applications со статусом pending и НЕ попадает
     в справочник, пока админ не одобрит её в очереди заявок.
     ЦЕНЫ НЕ МЕНЯТЬ: m1 = $2.50 · m3 = $7.00 · y1 = $15.00 */
  const PLAN_PRICE = { m1: "$2.50", m3: "$7.00", y1: "$15.00" };
  const PLAN_TTL  = { m1: 2592000000, m3: 7776000000, y1: 31536000000 }; /* 1 / 3 / 12 мес */
  const planName = (p) => t(p === "m1" ? "subM1" : p === "m3" ? "subM3" : "subY1");

  let selectedPlan = null;   /* тариф, выбранный на шаге 1 */
  let appStep = 1;           /* текущий шаг мастера (4 = «Готово») */
  let applyOpened = false;   /* анкета уже открывалась — селекты заполнены */
  let appRoutes = [];        /* пункты Б (перевозки) в заявке */

  function goAppStep(n) {
    appStep = n;
    [1, 2, 3, 4].forEach(i => { $("appPane" + i).hidden = i !== n; });
    const cur = Math.min(n, 3);
    [1, 2, 3].forEach(i => {
      const b = $("appStepBar" + i);
      b.classList.toggle("on", i === cur && n <= 3);
      b.classList.toggle("done", i < cur || n === 4);
    });
    $("appStepsCap").textContent = t(n >= 4 ? "appClose" : "appCap" + n);
    $("appErr").classList.remove("show");
    if (n === 3) fillApplySelects();
  }

  function openApply() {
    selectedPlan = null;
    appRoutes = [];

    $("appAgree").checked = false;

  /* ===== Анкета заявки (зеркало админ-формы, id с префиксом a) ===== */
  function fillApplySelects() {
    $("aCity").innerHTML = CITIES.map(c =>
      `<option value="${c.id}"${state.city === c.id ? " selected" : ""}>${esc(nm(c))}</option>`).join("");
    $("aCat").innerHTML = CATS.map(c =>
      `<option value="${c.id}"${state.cat === c.id ? " selected" : ""}>${esc(catName(c))}</option>`).join("");

  function syncApplyLevel() {
    const cat = catById($("aCat").value);
    if (cat.levels) {
      $("aLevelField").hidden = false;
      $("aLevel").innerHTML = cat.levels.map(l =>
        `<option value="${l.id}"${state.level === l.id ? " selected" : ""}>${esc(levelName(l))}</option>`).join("");

      $("aLevelField").hidden = true;
      $("aLevel").innerHTML = "";

    fillApplySubs();

  function fillApplySubs() {
    const cat = catById($("aCat").value);
    const lv = cat.levels
      ? (cat.levels.find(l => l.id === $("aLevel").value) || cat.levels[0])
      : levelsOf(cat)[0];
    $("aSub").innerHTML = lv.subs.map(s =>
      `<option value="${s.id}">${esc(nm(s))}</option>`).join("");
    updateApplyLabels();

  function updateApplyLabels() {
    const cat = catById($("aCat").value);
    if (!cat) return; /* селекты ещё не заполнены */
    const subcat = $("aSub").value;
    const must = needsLocation(cat, subcat);
    $("aLocLabel").innerHTML = esc(t("fLocation")) + (must ? ' <span class="req">*</span>' : "");
    $("aRoutesLabel").innerHTML = esc(t("routesLabel")) + ' <span class="req">*</span>';
    const isTransport = subcat === "transport";
    $("aCarField").hidden = !isTransport;
    $("aCarLabel").innerHTML = esc(t("carMake")) + (isTransport ? ' <span class="req">*</span>' : "");

  function syncApplyRoutes() {
    const isTransport = $("aSub").value === "transport";
    $("aRoutesField").hidden = !isTransport;
    if (!isTransport) return;
    const city = $("aCity").value;
    if (appRoutes.includes(city)) appRoutes = appRoutes.filter(id => id !== city);

      `<button type="button" class="chip${appRoutes.includes(c.id) ? " on" : ""}" data-aroute="${c.id}">${esc(nm(c))}</button>`).join("");

    if (appRoutes.includes(id)) {
      appRoutes = appRoutes.filter(x => x !== id);

  /* Отправка заявки: пишем в applications (pending), публикует админ */
  $("appForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!selectedPlan) { goAppStep(1); banner($("appErr"), "subSelectPlan"); return; }
    const cat = catById($("aCat").value);
    const groupId = cat.levels ? $("aLevel").value : cat.id;
    const subcat = $("aSub").value;
    const title = $("aTitle").value.trim();
    const titleEn = $("aTitleEn").value.trim();
    const phone = $("aPhone").value.trim();
    const location = $("aLoc").value.trim();
    const carMake = $("aCar").value.trim();
    const description = $("aDesc").value.trim();
    const city = $("aCity").value;

    if (!city || !title || !phone || !groupId) { banner($("appErr"), "fillRequired"); return; }

    if (needsLocation(cat, subcat) && !location) { banner($("appErr"), "locRequired"); return; }

    if (description.length > 600) { banner($("appErr"), "descLimit"); return; }

    const btn = $("appSendBtn");

    btn.textContent = t("appSending");

    try {
      const payload = {
        status: "pending",            /* увидит только админ; в справочнике заявки нет */
        plan: selectedPlan,
        planPrice: PLAN_PRICE[selectedPlan],
        type: cat.base === "stores" || cat.base === "pharmacies" ? "store"
             : cat.base === "services" || cat.base === "repair" ? "service" : "person",
        category: cat.base,
        group: groupId,
        subcategory: subcat,
        city,
        carMake: subcat === "transport" ? carMake : "",
        routes,
        title, phone, location, description,
        names: { ar: title },
        uiLang: state.lang            /* на каком языке заполняли — подсказка админу */
      };
      if (titleEn) payload.names.en = titleEn;
      await withTimeout(addDoc(collection(db, "applications"),
        { ...payload, createdAt: serverTimestamp() }), 20000);

      /* v1.2.6: кнопка = «Заплатить в WhatsApp»; текст чата собирается
         автоматически из анкеты — тариф (срок), имя как в анкете,
         категория, город, номер — Аммару ничего не нужно переспрашивать */
      const waNum = WA_SUPPORT.replace(/\D/g, "");
      const msg = encodeURIComponent(
        `${t("appDoneWaMsg")}\n` +
        `${t("waLblPlan")}: ${planName(selectedPlan)} · ${PLAN_PRICE[selectedPlan]}\n` +
        `${t("waLblName")}: ${title}\n` +
        `${t("waLblCat")}: ${subName(groupId, subcat)}\n` +
        `${t("waLblCity")}: ${cityName(city)}\n` +
        `${t("waLblPhone")}: ${phone}`);
      $("appDoneWa").href = `https://wa.me/${waNum}?text=${msg}`;
      $("appForm").reset();
      $("aDescCounter").textContent = "0 / 600";
      goAppStep(4);
      toast(t("appSentToast"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    } finally {
      btn.disabled = false;
      btn.textContent = t("appSend");
    }

  $("subFabIcon").innerHTML = icon("crown", 17);

  let loginBusy = false;
  async function doLogin() {
    if (loginBusy) return;
    const em = $("emailInput").value.trim();
    const pw = $("passInput").value.trim();
    if (!em || !pw) { banner($("loginErr"), "fillRequired"); return; }

    const btn = $("loginSubmitBtn");

    try {
